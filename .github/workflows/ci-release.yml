name: CI and Android Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-web:
    name: Verify and build web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build web and PWA
        run: npm run build

      - name: Verify web artifacts
        run: |
          test -f dist/dictionary.json
          test -f dist/manifest.webmanifest
          test -f dist/sitemap.xml
          test -f dist/robots.txt

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-android-apk:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAPACITOR_BUILD: 'true'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install, build, and sync Capacitor
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug

      - name: Assert signing is configured for tag builds
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_SIGNING_ENABLED != 'true'
        run: |
          echo "::error::Refusing to publish a tag release without Android signing secrets."
          exit 1

      - name: Configure release signing
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          {
            printf 'storeFile=../release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        run: android/gradlew -p android assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/*.apk release-apks/
          if compgen -G 'android/app/build/outputs/apk/release/*.apk' > /dev/null; then
            cp android/app/build/outputs/apk/release/*.apk release-apks/
          fi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Thinking Bridge ${{ github.ref_name }}
          body: |
            Official Android release. Download the APK below.

            Includes major edge refinements, RTL typesetting fixes, and accessibility improvements.
          files: release-apks/*.apk
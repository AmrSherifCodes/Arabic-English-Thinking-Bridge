name: CI Pipeline

on:
  push:
    branches: [ main, feat/masterpiece-release ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Web Production Assets
        run: npm run build

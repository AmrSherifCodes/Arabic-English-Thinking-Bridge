apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.amrsherif.thinkingenglish"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.amrsherif.thinkingenglish"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10000
        versionName "10.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*ort-wasm*'
        }
    }
    packagingOptions {
        jniLibs {
            // Compress native .so libs (ML Kit Translate + LiteRT) inside APK for lean low-end Android distribution
            useLegacyPackaging = true
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    splits {
        abi {
            enable false
        }
    }
    signingConfigs {
        release {
            def ksFile = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
                keyPassword keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
            }
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            def hasKey = keystoreProperties['storeFile'] || System.getenv('ANDROID_KEYSTORE_PATH')
            if (hasKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

task copyFinalApk {
    dependsOn 'assembleRelease'
    doLast {
        def desktopDir = new File(System.getProperty("user.home"), "Desktop")
        def targetApk = file("build/outputs/apk/release/app-arm64-v8a-release.apk")
        if (!targetApk.exists()) {
            targetApk = file("build/outputs/apk/release/app-universal-release.apk")
        }
        if (!targetApk.exists()) {
            targetApk = file("build/outputs/apk/release/app-release.apk")
        }
        if (targetApk.exists()) {
            copy {
                from targetApk
                into desktopDir
                rename { "ThinkingBridge-v10.0.0.apk" }
            }
            println "SUCCESS: Copied APK to ${desktopDir.absolutePath}/ThinkingBridge-v10.0.0.apk"
        } else {
            println "WARNING: Release APK not found."
        }
    }
}

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --kuffiyeh-line:rgba(67,90,45,0.055);
  --kuffiyeh-node:rgba(28,25,23,0.06);
  --sand-bg:#faf6ee;
}
html.dark{
  --kuffiyeh-line:rgba(180,201,158,0.055);
  --kuffiyeh-node:rgba(245,245,244,0.05);
  --sand-bg:#141310;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background-color:var(--sand-bg);
  background-image:
    radial-gradient(circle at 50% 50%,var(--kuffiyeh-node) 1.5px,transparent 2px),
    radial-gradient(circle at 0% 0%,var(--kuffiyeh-node) 1.5px,transparent 2px),
    radial-gradient(circle at 100% 0%,var(--kuffiyeh-node) 1.5px,transparent 2px),
    radial-gradient(circle at 0% 100%,var(--kuffiyeh-node) 1.5px,transparent 2px),
    radial-gradient(circle at 100% 100%,var(--kuffiyeh-node) 1.5px,transparent 2px),
    repeating-linear-gradient(45deg,var(--kuffiyeh-line) 0px,var(--kuffiyeh-line) 1px,transparent 1px,transparent 18px),
    repeating-linear-gradient(-45deg,var(--kuffiyeh-line) 0px,var(--kuffiyeh-line) 1px,transparent 1px,transparent 18px);
  background-size:36px 36px;
  background-attachment:fixed;
  color:#1c1917;
  margin:0;
}
html.dark body{background-color:var(--sand-bg);color:#f5f5f4}
.kuffiyeh-card-watermark{
  background-image:
    repeating-linear-gradient(45deg,var(--kuffiyeh-line) 0px,var(--kuffiyeh-line) 1px,transparent 1px,transparent 14px),
    repeating-linear-gradient(-45deg,var(--kuffiyeh-line) 0px,var(--kuffiyeh-line) 1px,transparent 1px,transparent 14px);
}
.ar{font-family:Cairo,'Segoe UI',sans-serif}
button,select{min-height:44px;touch-action:manipulation;cursor:pointer}
input,textarea,select{font-size:16px}
#v{padding-bottom:92px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
details>summary{cursor:pointer}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.shake{animation:shake .35s;border-color:#e11d48!important}
.conf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:50;animation:fall 1.6s ease-in forwards}
@media (prefers-reduced-motion:reduce){.shake,.conf{animation:none}}
/* v4: micro-interactions, voice selector, key hints */
.chunk-card{transition:transform .2s ease,box-shadow .2s ease;animation:chunkIn .35s ease both}
.chunk-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
@keyframes chunkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button:active{transform:scale(.97)}
.voice-sel{width:100%;min-height:44px;padding:.5rem .75rem;border-radius:.75rem;border:1px solid #d6d3d1;background:#fff;color:inherit;font-size:16px}
html.dark .voice-sel{background:#292524;border-color:#57534e}
kbd{display:inline-block;min-width:1.4em;padding:0 .35em;border:1px solid #a8a29e;border-bottom-width:2px;border-radius:.3rem;font-size:.75rem;text-align:center}
@media (prefers-reduced-motion:reduce){.chunk-card{animation:none;transition:none}button:active{transform:none}}
.owner-icon{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #0d9488;flex:none}
@media (max-width:360px){header>div:last-child button{padding-left:.5rem;padding-right:.5rem}.owner-icon{width:34px;height:34px}}
</style>

const PHASES = [{"id":1,"title":"Foundations & The Skeleton","titleAr":"الأساسات والهيكل البنائي","level":"A1+ – A2","tagline":"Master the core mechanics: linking verbs, possession, articles, and English sentence grammar.","lessons":[{"id":"p1-l1","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":1,"title":"The Hidden Copula (Nominal Sentences)","titleAr":"رابطة الكينونة الخفية (الجملة الاسمية)","transferConcept":"Arabic creates complete present statements with zero verbs (مبتدأ وخبر: هو طبيب). English grammar strictly forbids verbless sentences; an overt linking verb (\"am / is / are\") must serve as the structural backbone.","transferConceptAr":"في العربية، الجملة الاسمية تكتفي بالمبتدأ والخبر دون فعل في المضارع (هو طبيب). أما في الإنجليزية، فالجملة لا تكتمل أبداً بدون فعل رابط (am / is / are).","weakSpotTag":"copula-omission","exercises":[{"id":"ex-1-1-1","arabicThought":"هو مهندس معماري","englishTarget":"He is an architect","acceptableAlternatives":["He's an architect"],"wordChips":["He","is","an","architect","a","engineer","are"],"breakdownChunks":[{"arabicText":"هو","englishText":"He","role":"subject","explanation":"Subject pronoun"},{"arabicText":"— (غير منطوق في العربية)","englishText":"is","role":"verb","explanation":"Required copula verb in English"},{"arabicText":"مهندس معماري","englishText":"an architect","role":"object","explanation":"Indefinite singular noun taking \"an\""}],"habitHint":"In Arabic, you say \"هو مهندس\" without any verb. In English, you cannot leave the verb implicit. Which form of \"to be\" must bridge the subject and the noun?","specificMisconceptions":[{"pattern":"^he architect|^he an architect","diagnosis":"Notice how you omitted \"is\". In English, verbless sentences do not exist in the present tense."},{"pattern":"^(?!.*\\b(am|is|are|was|were|be|been|s|re)\\b)","diagnosis":"You left out the linking verb. Arabic joins subject and predicate with nothing between them (هو طبيب); English always needs am / is / are."}]},{"id":"ex-1-1-2","arabicThought":"الطقس بارد جداً اليوم","englishTarget":"The weather is very cold today","acceptableAlternatives":["The weather's very cold today","Today the weather is very cold"],"wordChips":["The","weather","is","very","cold","today","are","has"],"breakdownChunks":[{"arabicText":"الطقس","englishText":"The weather","role":"subject","explanation":"Definite subject"},{"arabicText":"— (فعل الكينونة المحذوف)","englishText":"is","role":"verb","explanation":"Required linking verb"},{"arabicText":"بارد جداً","englishText":"very cold","role":"modifier","explanation":"Adjective phrase complement"},{"arabicText":"اليوم","englishText":"today","role":"connector","explanation":"Time adverbial"}],"habitHint":"Arabic connects the weather directly to the adjective (الطقس بارد). English requires the copula \"is\" to hold the adjective to the subject.","specificMisconceptions":[{"pattern":"^(?!.*\\b(am|is|are|was|were|be|been|s|re)\\b)","diagnosis":"You left out the linking verb. Arabic joins subject and predicate with nothing between them (هو طبيب); English always needs am / is / are."}]},{"id":"ex-1-1-3","arabicThought":"نحن جاهزون للمقابلة","englishTarget":"We are ready for the interview","acceptableAlternatives":["We're ready for the interview"],"wordChips":["We","are","ready","for","the","interview","is","to"],"breakdownChunks":[{"arabicText":"نحن","englishText":"We","role":"subject","explanation":"Plural subject"},{"arabicText":"— (رابطة محذوفة)","englishText":"are","role":"verb","explanation":"Plural copula verb"},{"arabicText":"جاهزون","englishText":"ready","role":"modifier","explanation":"Predicate adjective"},{"arabicText":"للمقابلة","englishText":"for the interview","role":"object","explanation":"Prepositional complement"}],"habitHint":"Plural subject \"We\" needs the plural linking verb \"are\".","specificMisconceptions":[{"pattern":"^(?!.*\\b(am|is|are|was|were|be|been|s|re)\\b)","diagnosis":"You left out the linking verb. Arabic joins subject and predicate with nothing between them (هو طبيب); English always needs am / is / are."}]}]},{"id":"p1-l2","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":2,"title":"Articles & The Zero-Article Trap","titleAr":"أدوات التنكير والتعريف وفخ الاسم العام","transferConcept":"Arabic uses \"الـ\" for both specific items and generic categories (أحب الموسيقى = I like music). In English, generic mass nouns and plural general concepts take NO article (Zero Article), while singular countable nouns require \"a/an\".","transferConceptAr":"في العربية نضع \"الـ\" في العموميات (أحب الطبيعة). في الإنجليزية، المفاهيم العامة والأسماء غير المعدودة لا تأخذ أداة أبداً (I like nature)، بينما المفرد المعدود يحتاج \"a/an\".","weakSpotTag":"article-interference","exercises":[{"id":"ex-1-2-1","arabicThought":"أنا أحب القهوة الساخنة (بشكل عام)","englishTarget":"I like hot coffee","acceptableAlternatives":["I love hot coffee"],"wordChips":["I","like","hot","coffee","the","a","hot coffee"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"أحب","englishText":"like","role":"verb","explanation":"Active preference verb"},{"arabicText":"القهوة الساخنة","englishText":"hot coffee","role":"object","explanation":"Generic uncountable noun: NO \"the\"!"}],"habitHint":"Arabic says \"أحب القهوة\" with \"الـ\" for generic coffee. In English, talking about coffee in general takes ZERO article—never say \"the coffee\" unless pointing to a specific cup!","specificMisconceptions":[{"pattern":"\\bthe (music|coffee|tea|life|love|nature|water|happiness|time)\\b","diagnosis":"Arabic puts الـ before general ideas. English uses no article for general or uncountable nouns: music, coffee, life, not “the music”."}]},{"id":"ex-1-2-2","arabicThought":"هو اشترى دراجة جديدة","englishTarget":"He bought a new bicycle","acceptableAlternatives":["He bought a new bike"],"wordChips":["He","bought","a","new","bicycle","the","an","bike"],"breakdownChunks":[{"arabicText":"هو","englishText":"He","role":"subject","explanation":"Subject"},{"arabicText":"اشترى","englishText":"bought","role":"verb","explanation":"Past action"},{"arabicText":"دراجة جديدة","englishText":"a new bicycle","role":"object","explanation":"Singular countable noun requires indefinite \"a\""}],"habitHint":"Arabic relies on tanween for indefiniteness. English demands the discrete word \"a\" before a singular countable noun.","specificMisconceptions":[{"pattern":"\\bthe (music|coffee|tea|life|love|nature|water|happiness|time)\\b","diagnosis":"Arabic puts الـ before general ideas. English uses no article for general or uncountable nouns: music, coffee, life, not “the music”."}]},{"id":"ex-1-2-3","arabicThought":"الموسيقى تجعلني سعيداً (الموسيقى كفكرة عامة)","englishTarget":"Music makes me happy","acceptableAlternatives":["Music makes me feel happy"],"wordChips":["Music","makes","me","happy","The","is","make"],"breakdownChunks":[{"arabicText":"الموسيقى (عامة)","englishText":"Music","role":"subject","explanation":"Zero-article generic concept"},{"arabicText":"تجعلني","englishText":"makes me","role":"verb","explanation":"Causative verb with object pronoun"},{"arabicText":"سعيداً","englishText":"happy","role":"modifier","explanation":"Resultant state adjective"}],"habitHint":"Do not transfer the Arabic \"الـ\" onto general abstract nouns like Music, Life, or Love in English.","specificMisconceptions":[{"pattern":"\\bthe (music|coffee|tea|life|love|nature|water|happiness|time)\\b","diagnosis":"Arabic puts الـ before general ideas. English uses no article for general or uncountable nouns: music, coffee, life, not “the music”."}]}]},{"id":"p1-l3","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":3,"title":"Possession: \"Have\" vs عندي / لدي","titleAr":"الملكية: I have مقابل عندي ولدي","transferConcept":"In Arabic, possession is expressed through a prepositional phrase of location (عندي / معي = \"at/with me\"). In English, the human is the active grammatical subject performing the verb \"to have\".","transferConceptAr":"العربية تعبر عن الملكية بشبه جملة مكانية (عندي / لدي). في الإنجليزية، الشخص نفسه هو الفاعل المباشر الذي يملك الفعل: I have.","weakSpotTag":"possession-transfer","exercises":[{"id":"ex-1-3-1","arabicThought":"عندي سؤال مهم","englishTarget":"I have an important question","acceptableAlternatives":["I've an important question","I've got an important question","I have got an important question"],"wordChips":["I","have","an","important","question","with","at","a"],"breakdownChunks":[{"arabicText":"عندي (الفاعل المستتر: أنا)","englishText":"I","role":"subject","explanation":"The possessor becomes subject"},{"arabicText":"عند","englishText":"have","role":"verb","explanation":"Active possession verb"},{"arabicText":"سؤال مهم","englishText":"an important question","role":"object","explanation":"Modifier preceding noun with \"an\""}],"habitHint":"Avoid literal preposition translation like \"with me\" or \"at me\". Shift the thought so \"I\" is the active possessor with \"have\".","specificMisconceptions":[{"pattern":"\\b(with|at|by|near) me\\b|\\b(have|has) with\\b|\\bthere (is|are)\\b","diagnosis":"Arabic shows possession with a place word (عندي = “at me”). English makes the owner the subject: I have…, He has…."}]},{"id":"ex-1-3-2","arabicThought":"عنده سيارة كهربائية","englishTarget":"He has an electric car","acceptableAlternatives":["He's got an electric car","He has got an electric car"],"wordChips":["He","has","an","electric","car","have","with","a"],"breakdownChunks":[{"arabicText":"هو (من \"عنده\")","englishText":"He","role":"subject","explanation":"Third person singular"},{"arabicText":"عند","englishText":"has","role":"verb","explanation":"Conjugated form of \"have\""},{"arabicText":"سيارة كهربائية","englishText":"an electric car","role":"object","explanation":"Adjective before noun with \"an\""}],"habitHint":"For \"he/she/it\", the verb \"have\" shifts to \"has\".","specificMisconceptions":[{"pattern":"\\b(with|at|by|near) me\\b|\\b(have|has) with\\b|\\bthere (is|are)\\b","diagnosis":"Arabic shows possession with a place word (عندي = “at me”). English makes the owner the subject: I have…, He has…."}]},{"id":"ex-1-3-3","arabicThought":"ليس لدي وقت كافٍ","englishTarget":"I do not have enough time","acceptableAlternatives":["I don't have enough time","I have no time","I haven't got enough time"],"wordChips":["I","do","not","have","enough","time","don't","no","with"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"ليس","englishText":"do not","role":"auxiliary","explanation":"Negative auxiliary do + not"},{"arabicText":"لدي","englishText":"have","role":"verb","explanation":"Base verb of possession"},{"arabicText":"وقت كافٍ","englishText":"enough time","role":"object","explanation":"Determiner + mass noun"}],"habitHint":"To negate possession, English deploys the auxiliary \"do not have\", not \"not have\" alone.","specificMisconceptions":[{"pattern":"\\b(with|at|by|near) me\\b|\\b(have|has) with\\b|\\bthere (is|are)\\b","diagnosis":"Arabic shows possession with a place word (عندي = “at me”). English makes the owner the subject: I have…, He has…."}]}]},{"id":"p1-l4","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":4,"title":"Basic Negation with Do / Don't","titleAr":"النفي الأساسي بواسطة Do و Don't","transferConcept":"Arabic places negative particles (لا / ما) directly in front of any conjugated verb (أنا لا أدخن). English cannot attach \"not\" directly to a lexical verb; it must recruit the helper dummy \"do/does\" to bear the negation (I do not smoke).","transferConceptAr":"العربية تنفي الفعل مباشرة بـ (لا / ما). الإنجليزية تعجز عن نفي الفعل المعجمي مباشرة بدون استدعاء الفعل المساعد (do/does) ليحمل أداة النفي not.","weakSpotTag":"negation-auxiliary","exercises":[{"id":"ex-1-4-1","arabicThought":"أنا لا أشرب الشاي الأخضر","englishTarget":"I do not drink green tea","acceptableAlternatives":["I don't drink green tea"],"wordChips":["I","do","not","drink","green","tea","don't","no","the"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"لا","englishText":"do not","role":"auxiliary","explanation":"Auxiliary dummy \"do\" + negative marker \"not\""},{"arabicText":"أشرب","englishText":"drink","role":"verb","explanation":"Bare infinitive verb"},{"arabicText":"الشاي الأخضر","englishText":"green tea","role":"object","explanation":"Adjective first, generic mass noun"}],"habitHint":"Never say \"I not drink\" or \"I no drink\". English requires the auxiliary verb \"do\" to host the word \"not\".","specificMisconceptions":[{"pattern":"\\b(i|you|we|they|he|she|sarah) (not|no) \\w+","diagnosis":"English can’t put “not” or “no” straight before a main verb. Add do / does + not and keep the main verb in its base form."},{"pattern":"\\bdoes not \\w+s\\b","diagnosis":"After does not, the main verb loses its -s: does not work."}]},{"id":"ex-1-4-2","arabicThought":"سارة لا تعمل في عطلة نهاية الأسبوع","englishTarget":"Sarah does not work on the weekend","acceptableAlternatives":["Sarah doesn't work on the weekend","Sarah doesn't work on weekends","Sarah does not work on weekends"],"wordChips":["Sarah","does","not","work","on","the","weekend","doesn't","works","in"],"breakdownChunks":[{"arabicText":"سارة","englishText":"Sarah","role":"subject","explanation":"Third-person singular subject"},{"arabicText":"لا","englishText":"does not","role":"auxiliary","explanation":"\"Does\" carries the 3rd person -s and \"not\""},{"arabicText":"تعمل","englishText":"work","role":"verb","explanation":"Reverts to base form without -s"},{"arabicText":"في عطلة نهاية الأسبوع","englishText":"on the weekend","role":"connector","explanation":"Preposition of specific occasion"}],"habitHint":"For third person (Sarah), \"does\" takes the third-person -s. Notice that \"work\" drops its -s!","specificMisconceptions":[{"pattern":"\\b(i|you|we|they|he|she|sarah) (not|no) \\w+","diagnosis":"English can’t put “not” or “no” straight before a main verb. Add do / does + not and keep the main verb in its base form."},{"pattern":"\\bdoes not \\w+s\\b","diagnosis":"After does not, the main verb loses its -s: does not work."}]},{"id":"ex-1-4-3","arabicThought":"هم لا يعيشون هنا بعد الآن","englishTarget":"They do not live here anymore","acceptableAlternatives":["They don't live here anymore"],"wordChips":["They","do","not","live","here","anymore","don't","are","not"],"breakdownChunks":[{"arabicText":"هم","englishText":"They","role":"subject","explanation":"Subject pronoun"},{"arabicText":"لا","englishText":"do not","role":"auxiliary","explanation":"Negative operator"},{"arabicText":"يعيشون","englishText":"live","role":"verb","explanation":"Base verb"},{"arabicText":"هنا بعد الآن","englishText":"here anymore","role":"modifier","explanation":"Locative and temporal modifier"}],"habitHint":"Use \"do not\" (or \"don't\") before the base verb.","specificMisconceptions":[{"pattern":"\\b(i|you|we|they|he|she|sarah) (not|no) \\w+","diagnosis":"English can’t put “not” or “no” straight before a main verb. Add do / does + not and keep the main verb in its base form."},{"pattern":"\\bdoes not \\w+s\\b","diagnosis":"After does not, the main verb loses its -s: does not work."}]}]},{"id":"p1-l5","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":5,"title":"Questions with Do / Does","titleAr":"تكوين السؤال بواسطة Do و Does","transferConcept":"Arabic turns any statement into a yes/no question by simply prefixing \"هل\" without altering the sentence syntax. English reshuffles structure: it must place the auxiliary \"Do / Does\" at the front of the sentence.","transferConceptAr":"العربية تحول الجملة إلى سؤال بوضع \"هل\" في البداية دون المساس ببناء الجملة. الإنجليزية تقلب التركيب وتضع الفعل المساعد Do/Does في المقدمة متبوعاً بالفاعل ثم الفعل المجرد.","weakSpotTag":"question-inversion","exercises":[{"id":"ex-1-5-1","arabicThought":"هل تتحدث الإنجليزية بطلاقة؟","englishTarget":"Do you speak English fluently","acceptableAlternatives":["Do you speak fluent English"],"wordChips":["Do","you","speak","English","fluently","Are","fluent","does"],"breakdownChunks":[{"arabicText":"هل","englishText":"Do","role":"auxiliary","explanation":"Fronted auxiliary question marker"},{"arabicText":"أنت (في \"تتحدث\")","englishText":"you","role":"subject","explanation":"Second person subject"},{"arabicText":"تتحدث","englishText":"speak","role":"verb","explanation":"Base lexical verb"},{"arabicText":"الإنجليزية","englishText":"English","role":"object","explanation":"Direct language object"},{"arabicText":"بطلاقة","englishText":"fluently","role":"modifier","explanation":"Manner adverb"}],"habitHint":"Never say \"Are you speak...\". When asking about regular actions, the sentence must open with \"Do\" or \"Does\".","specificMisconceptions":[{"pattern":"^(are|is) (you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"“Are / is” can’t help a regular verb. Start with Do / Does."},{"pattern":"^(you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"Arabic marks a question with هل and keeps the word order. English puts the helper Do / Does first."},{"pattern":"\\bdoes \\w+ \\w+ (lives|speaks|needs)\\b","diagnosis":"After Does the main verb loses its -s: Does your brother live…?"}]},{"id":"ex-1-5-2","arabicThought":"هل يعيش أخوك في لندن؟","englishTarget":"Does your brother live in London","acceptableAlternatives":["Does your brother stay in London"],"wordChips":["Does","your","brother","live","in","London","Do","lives","at"],"breakdownChunks":[{"arabicText":"هل","englishText":"Does","role":"auxiliary","explanation":"3rd person singular question opener"},{"arabicText":"أخوك","englishText":"your brother","role":"subject","explanation":"Singular noun phrase"},{"arabicText":"يعيش","englishText":"live","role":"verb","explanation":"Base verb (the -s is on Does)"},{"arabicText":"في لندن","englishText":"in London","role":"connector","explanation":"City preposition phrase"}],"habitHint":"Since \"your brother\" is third-person singular (he), start with \"Does\", and use \"live\" without -s.","specificMisconceptions":[{"pattern":"^(are|is) (you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"“Are / is” can’t help a regular verb. Start with Do / Does."},{"pattern":"^(you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"Arabic marks a question with هل and keeps the word order. English puts the helper Do / Does first."},{"pattern":"\\bdoes \\w+ \\w+ (lives|speaks|needs)\\b","diagnosis":"After Does the main verb loses its -s: Does your brother live…?"}]},{"id":"ex-1-5-3","arabicThought":"هل تحتاج إلى أي مساعدة الآن؟","englishTarget":"Do you need any help now","acceptableAlternatives":["Do you need some help now","Do you require any help now"],"wordChips":["Do","you","need","any","help","now","Are","needed","to"],"breakdownChunks":[{"arabicText":"هل","englishText":"Do","role":"auxiliary","explanation":"Fronted auxiliary"},{"arabicText":"أنت","englishText":"you","role":"subject","explanation":"Subject"},{"arabicText":"تحتاج","englishText":"need","role":"verb","explanation":"Stative verb of need"},{"arabicText":"أي مساعدة","englishText":"any help","role":"object","explanation":"Quantifier for interrogatives + mass noun"},{"arabicText":"الآن","englishText":"now","role":"connector","explanation":"Time adverb"}],"habitHint":"In English questions, we use \"any\" with uncountable nouns like \"help\", preceded by \"Do you need\".","specificMisconceptions":[{"pattern":"^(are|is) (you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"“Are / is” can’t help a regular verb. Start with Do / Does."},{"pattern":"^(you|your brother|he|she|they) (speak|live|need)\\b","diagnosis":"Arabic marks a question with هل and keeps the word order. English puts the helper Do / Does first."},{"pattern":"\\bdoes \\w+ \\w+ (lives|speaks|needs)\\b","diagnosis":"After Does the main verb loses its -s: Does your brother live…?"}]}]},{"id":"p1-l6","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":6,"title":"Modals: Can / Want to / Need to","titleAr":"أفعال الرغبة والقدرة: Can و Want to و Need to","transferConcept":"In Arabic, expressions of intent take \"أن\" + subjunctive verb (أريد أن أذهب, أستطيع أن أفعل). In English, \"can\" takes a bare infinitive without \"to\", while \"want\" and \"need\" require the infinitive particle \"to\".","transferConceptAr":"في العربية نستخدم \"أن\" المصدرية بعد أفعال الإرادة والقدرة (أريد أن أذهب / أستطيع أن أساعد). في الإنجليزية، Can تأتي بدون to، بينما Want و Need تتطلبان to دائماً.","weakSpotTag":"infinitive-particle","exercises":[{"id":"ex-1-6-1","arabicThought":"أستطيع مساعدتك في هذا المشروع","englishTarget":"I can help you with this project","acceptableAlternatives":["I can assist you with this project"],"wordChips":["I","can","help","you","with","this","project","to","helping","in"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"أستطيع","englishText":"can","role":"auxiliary","explanation":"Modal of ability (never takes \"to\")"},{"arabicText":"مساعدتك","englishText":"help you","role":"verb","explanation":"Bare infinitive verb + pronoun"},{"arabicText":"في هذا المشروع","englishText":"with this project","role":"connector","explanation":"Collocation: help with something"}],"habitHint":"Watch out: modal \"can\" NEVER takes \"to\" in English. Say \"I can help\", not \"I can to help\".","specificMisconceptions":[{"pattern":"\\bcan to\\b","diagnosis":"“can” is a modal: it never takes “to”. Say I can help."},{"pattern":"\\b(want|need) (learn|leave|go|help|study)\\b","diagnosis":"want and need link to another verb with “to”: want to learn, need to leave."}]},{"id":"ex-1-6-2","arabicThought":"أريد أن أتعلم لغة جديدة","englishTarget":"I want to learn a new language","acceptableAlternatives":["I wish to learn a new language"],"wordChips":["I","want","to","learn","a","new","language","can","learning","the"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"أريد","englishText":"want","role":"verb","explanation":"Verb of desire"},{"arabicText":"أن أتعلم","englishText":"to learn","role":"verb","explanation":"Full infinitive with \"to\""},{"arabicText":"لغة جديدة","englishText":"a new language","role":"object","explanation":"Modifier before countable noun"}],"habitHint":"\"Want\" always links to another verb with \"to\": \"want to learn\".","specificMisconceptions":[{"pattern":"\\bcan to\\b","diagnosis":"“can” is a modal: it never takes “to”. Say I can help."},{"pattern":"\\b(want|need) (learn|leave|go|help|study)\\b","diagnosis":"want and need link to another verb with “to”: want to learn, need to leave."}]},{"id":"ex-1-6-3","arabicThought":"نحن بحاجة إلى مغادرة المكان الآن","englishTarget":"We need to leave the place now","acceptableAlternatives":["We need to leave now"],"wordChips":["We","need","to","leave","the","place","now","leaving","must","of"],"breakdownChunks":[{"arabicText":"نحن","englishText":"We","role":"subject","explanation":"Subject"},{"arabicText":"بحاجة إلى","englishText":"need to","role":"verb","explanation":"Semi-modal verb + infinitive particle"},{"arabicText":"مغادرة","englishText":"leave","role":"verb","explanation":"Base verb"},{"arabicText":"المكان الآن","englishText":"the place now","role":"object","explanation":"Object noun phrase and adverb"}],"habitHint":"Link \"need\" to the verb with \"to\": \"We need to leave\".","specificMisconceptions":[{"pattern":"\\bcan to\\b","diagnosis":"“can” is a modal: it never takes “to”. Say I can help."},{"pattern":"\\b(want|need) (learn|leave|go|help|study)\\b","diagnosis":"want and need link to another verb with “to”: want to learn, need to leave."}]}]},{"id":"p1-l7","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":7,"title":"Adjective Placement: Modifier Before Noun","titleAr":"موقع الصفة: الوصف يسبق الموصوف دائماً","transferConcept":"In Arabic, the adjective strictly follows the noun (سيارة سريعة, فكرة ذكية). English grammar inverts this cognitive lens: the modifier must always precede the head noun (a fast car, a clever idea).","transferConceptAr":"في العربية، النعت يتبع المنعوت دائماً (سيارة سريعة). في الإنجليزية ينعكس الترتيب الذهني: الصفة تسبق الاسم دائماً (a fast car).","weakSpotTag":"adjective-order","exercises":[{"id":"ex-1-7-1","arabicThought":"هذا بيت كبير وجميل","englishTarget":"This is a big and beautiful house","acceptableAlternatives":["This is a beautiful and big house","This is a big beautiful house"],"wordChips":["This","is","a","big","and","beautiful","house","house big","the"],"breakdownChunks":[{"arabicText":"هذا","englishText":"This","role":"subject","explanation":"Demonstrative pronoun"},{"arabicText":"—","englishText":"is","role":"verb","explanation":"Copula"},{"arabicText":"كبير وجميل","englishText":"a big and beautiful","role":"modifier","explanation":"Adjectives positioned BEFORE the noun"},{"arabicText":"بيت","englishText":"house","role":"object","explanation":"Head noun"}],"habitHint":"Do not transfer Arabic word order \"house big\". The adjective paints the picture before the noun arrives: \"big beautiful house\".","specificMisconceptions":[{"pattern":"\\b(house|friend|plan|car|book|idea) (big|old|clever|smart|new|beautiful|electric|fast)\\b","diagnosis":"Arabic puts the adjective after the noun (بيت كبير). English puts it before: a big house."}]},{"id":"ex-1-7-2","arabicThought":"قابلت صديقاً قديماً من الجامعة","englishTarget":"I met an old friend from university","acceptableAlternatives":["I met an old friend from college"],"wordChips":["I","met","an","old","friend","from","university","a","friend old","the"],"breakdownChunks":[{"arabicText":"قابلت (أنا)","englishText":"I met","role":"verb","explanation":"Subject + simple past verb"},{"arabicText":"صديقاً قديماً","englishText":"an old friend","role":"object","explanation":"Article + adjective + head noun"},{"arabicText":"من الجامعة","englishText":"from university","role":"connector","explanation":"Origin prepositional phrase"}],"habitHint":"\"Old\" comes before \"friend\", and takes the article \"an\" because \"old\" begins with a vowel sound.","specificMisconceptions":[{"pattern":"\\b(house|friend|plan|car|book|idea) (big|old|clever|smart|new|beautiful|electric|fast)\\b","diagnosis":"Arabic puts the adjective after the noun (بيت كبير). English puts it before: a big house."}]},{"id":"ex-1-7-3","arabicThought":"لديهم خطة ذكية جداً","englishTarget":"They have a very clever plan","acceptableAlternatives":["They have a very smart plan"],"wordChips":["They","have","a","very","clever","plan","smart","plan clever","an"],"breakdownChunks":[{"arabicText":"لديهم","englishText":"They have","role":"subject","explanation":"Active subject + verb"},{"arabicText":"خطة ذكية جداً","englishText":"a very clever plan","role":"object","explanation":"Intensifier + adjective + noun"}],"habitHint":"The entire descriptive cluster (\"very clever\") sits right before the noun \"plan\".","specificMisconceptions":[{"pattern":"\\b(house|friend|plan|car|book|idea) (big|old|clever|smart|new|beautiful|electric|fast)\\b","diagnosis":"Arabic puts the adjective after the noun (بيت كبير). English puts it before: a big house."}]}]},{"id":"p1-l8","phaseId":1,"phaseTitle":"Foundations & The Skeleton","phaseLevel":"A1+ – A2","number":8,"title":"Spatial & Temporal Prepositions: In, On, At","titleAr":"حروف الجر المكانية والزمانية: In و On و At","transferConcept":"Arabic over-relies on \"في\" for spaces, institutions, and time periods (في العمل, في الجمعة, في الليل). English divides spatial and temporal realms into a strict pyramid: AT (precise points/institutions), ON (surfaces & specific days), IN (enclosed volumes & broad periods).","transferConceptAr":"العربية تستخدم \"في\" لمعظم الظروف المكانية والزمانية (في العمل، في الصباح، في يوم الجمعة). الإنجليزية تقسمها لهرم صارم: At للنقاط المحددة والمؤسسات، On للسطوح والأيام، In للأوعية المغلقة والفترات الطويلة.","weakSpotTag":"preposition-pyramid","exercises":[{"id":"ex-1-8-1","arabicThought":"أنا في العمل الآن وسأتصل بك لاحقاً","englishTarget":"I am at work now and I will call you later","acceptableAlternatives":["I'm at work now and I will call you later","I'm at work now and will call you later"],"wordChips":["I","am","at","work","now","and","will","call","you","later","in","the"],"breakdownChunks":[{"arabicText":"أنا في العمل","englishText":"I am at work","role":"subject","explanation":"Institutional location uses \"at work\", not \"in work\""},{"arabicText":"الآن","englishText":"now","role":"modifier","explanation":"Time adverb"},{"arabicText":"وسأتصل بك لاحقاً","englishText":"and I will call you later","role":"connector","explanation":"Future clause"}],"habitHint":"Arabic says \"في العمل\", but institutional states in English take \"at\": at work, at school, at home.","specificMisconceptions":[{"pattern":"\\bin (work|monday|tuesday|friday|sunday|night)\\b|\\bat (monday|friday|sunday|the morning|morning)\\b|\\bon (the morning|morning|work)\\b","diagnosis":"Arabic uses في for almost everything. English splits it: AT for institutions and points (at work, at night), ON for days (on Monday), IN for parts of the day (in the morning)."}]},{"id":"ex-1-8-2","arabicThought":"لدينا اجتماع مهم في يوم الاثنين","englishTarget":"We have an important meeting on Monday","acceptableAlternatives":["We've an important meeting on Monday"],"wordChips":["We","have","an","important","meeting","on","Monday","in","at","a"],"breakdownChunks":[{"arabicText":"لدينا","englishText":"We have","role":"verb","explanation":"Possession"},{"arabicText":"اجتماع مهم","englishText":"an important meeting","role":"object","explanation":"Noun phrase"},{"arabicText":"في يوم الاثنين","englishText":"on Monday","role":"connector","explanation":"Specific calendar days take ON"}],"habitHint":"For calendar days and dates (Monday, Friday), English strictly uses \"on\", never \"in\".","specificMisconceptions":[{"pattern":"\\bin (work|monday|tuesday|friday|sunday|night)\\b|\\bat (monday|friday|sunday|the morning|morning)\\b|\\bon (the morning|morning|work)\\b","diagnosis":"Arabic uses في for almost everything. English splits it: AT for institutions and points (at work, at night), ON for days (on Monday), IN for parts of the day (in the morning)."}]},{"id":"ex-1-8-3","arabicThought":"هو يستيقظ مبكراً في الصباح","englishTarget":"He wakes up early in the morning","acceptableAlternatives":["He gets up early in the morning"],"wordChips":["He","wakes","up","early","in","the","morning","at","on","wake"],"breakdownChunks":[{"arabicText":"هو يستيقظ","englishText":"He wakes up","role":"verb","explanation":"Phrasal verb with 3rd person -s"},{"arabicText":"مبكراً","englishText":"early","role":"modifier","explanation":"Manner/time adverb"},{"arabicText":"في الصباح","englishText":"in the morning","role":"connector","explanation":"Time chunk taking \"in the\""}],"habitHint":"Broad periods of the day take \"in the\" (in the morning, in the evening), while \"at night\" is the exception.","specificMisconceptions":[{"pattern":"\\bin (work|monday|tuesday|friday|sunday|night)\\b|\\bat (monday|friday|sunday|the morning|morning)\\b|\\bon (the morning|morning|work)\\b","diagnosis":"Arabic uses في for almost everything. English splits it: AT for institutions and points (at work, at night), ON for days (on Monday), IN for parts of the day (in the morning)."}]}]}]},{"id":2,"title":"Flow & Nuance","titleAr":"الانسيابية والدقة التركيبية","level":"B1 – B2","tagline":"Connect thoughts seamlessly: perfect aspect vs لقد, relative clauses, conditionals, and phrasal logic.","lessons":[{"id":"p2-l1","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":9,"title":"Past Simple vs Present Perfect (The \"قد\" Paradigm)","titleAr":"الماضي البسيط مقابل المضارع التام (فلسفة قد ولقد)","transferConcept":"Arabic speakers often translate \"لقد / قد\" indiscriminately into the past tense or assume \"have + V3\" refers to old history. In English, Present Perfect connects the past action directly to present consequences, while Past Simple locks the action in a closed historical time frame.","transferConceptAr":"المتحدث بالعربية يترجم \"لقد\" أحياناً كماضٍ عادي. في الإنجليزية، المضارع التام (have + V3) يربط أثر الفعل باللحظة الحالية (النتيجة حية الآن)، بينما الماضي البسيط يغلق الحدث في زمن ماضٍ منقطع.","weakSpotTag":"aspect-confusion","exercises":[{"id":"ex-2-1-1","arabicThought":"لقد فقدت مفاتيحي (وما زلت أبحث عنها ولا أستطيع الدخول الآن)","englishTarget":"I have lost my keys","acceptableAlternatives":["I've lost my keys"],"wordChips":["I","have","lost","my","keys","did","lose","had"],"breakdownChunks":[{"arabicText":"لقد (أثر حاضر)","englishText":"have","role":"auxiliary","explanation":"Present bridge auxiliary"},{"arabicText":"فقدت","englishText":"lost","role":"verb","explanation":"Past participle with active consequence"},{"arabicText":"مفاتيحي","englishText":"my keys","role":"object","explanation":"Possessive + plural noun"}],"habitHint":"Because the consequence is alive right now (you cannot open the door), English views this not as finished history, but as Present Perfect: \"I have lost\".","specificMisconceptions":[{"pattern":"\\b(have|has) \\w+ (yesterday|last (year|week|night|month))\\b|\\bhave bought\\b.*yesterday","diagnosis":"A finished-time word like yesterday forces the past simple. Present perfect is for results that still matter now."},{"pattern":"\\bdid you ever\\b","diagnosis":"To ask about life experience use Have you ever + past participle."}]},{"id":"ex-2-1-2","arabicThought":"لقد اشتريت هذه الساعة أمس","englishTarget":"I bought this watch yesterday","acceptableAlternatives":["Yesterday I bought this watch"],"wordChips":["I","bought","this","watch","yesterday","have","bought","had"],"breakdownChunks":[{"arabicText":"اشتريت (أمس)","englishText":"bought","role":"verb","explanation":"Simple past: the time anchor \"yesterday\" closed the door"},{"arabicText":"هذه الساعة","englishText":"this watch","role":"object","explanation":"Demonstrative + noun"},{"arabicText":"أمس","englishText":"yesterday","role":"connector","explanation":"Specific past time anchor (forbids Present Perfect!)"}],"habitHint":"Even if Arabic uses \"لقد\", mentioning a specific finished time word (\"yesterday\", \"last year\") strictly forces Past Simple: \"I bought\", NOT \"I have bought\".","specificMisconceptions":[{"pattern":"\\b(have|has) \\w+ (yesterday|last (year|week|night|month))\\b|\\bhave bought\\b.*yesterday","diagnosis":"A finished-time word like yesterday forces the past simple. Present perfect is for results that still matter now."},{"pattern":"\\bdid you ever\\b","diagnosis":"To ask about life experience use Have you ever + past participle."}]},{"id":"ex-2-1-3","arabicThought":"هل سبق لك أن زرت اليابان؟","englishTarget":"Have you ever visited Japan","acceptableAlternatives":["Have you ever been to Japan"],"wordChips":["Have","you","ever","visited","Japan","Did","visit","were"],"breakdownChunks":[{"arabicText":"هل (في تجربة حياتك كلها)","englishText":"Have you ever","role":"auxiliary","explanation":"Life experience question formula"},{"arabicText":"زرت","englishText":"visited","role":"verb","explanation":"Past participle"},{"arabicText":"اليابان","englishText":"Japan","role":"object","explanation":"Proper noun"}],"habitHint":"When asking whether an experience occurred at any point in a living person's life, English uses \"Have you ever...\".","specificMisconceptions":[{"pattern":"\\b(have|has) \\w+ (yesterday|last (year|week|night|month))\\b|\\bhave bought\\b.*yesterday","diagnosis":"A finished-time word like yesterday forces the past simple. Present perfect is for results that still matter now."},{"pattern":"\\bdid you ever\\b","diagnosis":"To ask about life experience use Have you ever + past participle."}]}]},{"id":"p2-l2","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":10,"title":"Zero Relative Clauses & The Ghost Pronoun (ضمير العائد)","titleAr":"صلة الموصول وحذف ضمير العائد (The Ghost Pronoun)","transferConcept":"Arabic requires a resumptive pronoun referring back to the head noun in relative clauses (الرجل الذي رأيته = \"the man that I saw HIM\"). English strictly bans this redundant ghost pronoun when the relative pronoun serves as the direct object.","transferConceptAr":"العربية تتطلب وجود ضمير العائد على الاسم الموصول (الفيلم الذي شاهدتـه). الإنجليزية تحظر تكرار هذا الضمير منعاً باتاً: تقول \"the movie I watched\" وليس \"the movie I watched it\".","weakSpotTag":"resumptive-pronoun","exercises":[{"id":"ex-2-2-1","arabicThought":"الكتاب الذي استعرته مفيد جداً","englishTarget":"The book I borrowed is very useful","acceptableAlternatives":["The book that I borrowed is very useful","The book which I borrowed is very useful"],"wordChips":["The","book","I","borrowed","is","very","useful","it","him","was"],"breakdownChunks":[{"arabicText":"الكتاب","englishText":"The book","role":"subject","explanation":"Head noun"},{"arabicText":"الذي استعرته (بدون \"ـه\")","englishText":"I borrowed","role":"modifier","explanation":"Reduced relative clause (NO \"it\"!)"},{"arabicText":"هو","englishText":"is","role":"verb","explanation":"Main clause copula"},{"arabicText":"مفيد جداً","englishText":"very useful","role":"modifier","explanation":"Adjective complement"}],"habitHint":"Delete the Arabic resumptive pronoun \"ـه\". Say \"The book I borrowed\", NOT \"The book I borrowed it\".","specificMisconceptions":[{"pattern":"\\b(borrowed|visited|watched|read|bought|saw|used) (it|him|her|them)\\b|\\bspoke with (him|her|them)\\b","diagnosis":"Arabic repeats the object with a pronoun (استعرتُه). English drops it: The book I borrowed, not I borrowed it."}]},{"id":"ex-2-2-2","arabicThought":"هذا هو المهندس الذي تحدثت معه أمس","englishTarget":"This is the engineer I spoke with yesterday","acceptableAlternatives":["This is the engineer that I spoke with yesterday","This is the engineer whom I spoke with yesterday"],"wordChips":["This","is","the","engineer","I","spoke","with","yesterday","him","spoke him"],"breakdownChunks":[{"arabicText":"هذا هو المهندس","englishText":"This is the engineer","role":"subject","explanation":"Main clause"},{"arabicText":"الذي تحدثت معه","englishText":"I spoke with","role":"modifier","explanation":"Relative clause with stranded preposition"},{"arabicText":"أمس","englishText":"yesterday","role":"connector","explanation":"Time adverb"}],"habitHint":"The preposition \"with\" stays, but discard \"him\" at the end: \"the engineer I spoke with\".","specificMisconceptions":[{"pattern":"\\b(borrowed|visited|watched|read|bought|saw|used) (it|him|her|them)\\b|\\bspoke with (him|her|them)\\b","diagnosis":"Arabic repeats the object with a pronoun (استعرتُه). English drops it: The book I borrowed, not I borrowed it."}]},{"id":"ex-2-2-3","arabicThought":"المكان الذي زرناه كان مذهلاً","englishTarget":"The place we visited was amazing","acceptableAlternatives":["The place that we visited was amazing","The place which we visited was amazing"],"wordChips":["The","place","we","visited","was","amazing","it","there","is"],"breakdownChunks":[{"arabicText":"المكان","englishText":"The place","role":"subject","explanation":"Head noun"},{"arabicText":"الذي زرناه (بدون \"ـه\")","englishText":"we visited","role":"modifier","explanation":"Relative clause with zero ghost pronoun"},{"arabicText":"كان","englishText":"was","role":"verb","explanation":"Past copula"},{"arabicText":"مذهلاً","englishText":"amazing","role":"modifier","explanation":"Predicate adjective"}],"habitHint":"Drop \"it\" after \"visited\": \"The place we visited was amazing\".","specificMisconceptions":[{"pattern":"\\b(borrowed|visited|watched|read|bought|saw|used) (it|him|her|them)\\b|\\bspoke with (him|her|them)\\b","diagnosis":"Arabic repeats the object with a pronoun (استعرتُه). English drops it: The book I borrowed, not I borrowed it."}]}]},{"id":"p2-l3","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":11,"title":"Hypothetical Conditionals (لو vs إذا)","titleAr":"الجمل الشرطية والافتراض الذهني (لو مقابل إذا)","transferConcept":"Arabic distinguishes real conditions (إذا / إن) from hypothetical unreal conditions (لو). English mirrors this by stepping tense back into the past (\"If I had / If I were\") and pairing it with modal \"would\" in the result clause.","transferConceptAr":"العربية تفرق بين إذا الواقعية ولو الامتناعية. في الإنجليزية يقابل \"لو\" الرجوع خطوة زمنية للماضي (If I were / had) مع استخدام \"would\" في جواب الشرط.","weakSpotTag":"conditional-backshift","exercises":[{"id":"ex-2-3-1","arabicThought":"لو كنت مكانك لقبلت ذلك العرض","englishTarget":"If I were you I would accept that offer","acceptableAlternatives":["If I were you I'd accept that offer","If I was you I would accept that offer","If I was you I'd accept that offer"],"wordChips":["If","I","were","you","would","accept","that","offer","will","am","accepted"],"breakdownChunks":[{"arabicText":"لو كنت مكانك","englishText":"If I were you","role":"connector","explanation":"Hypothetical condition (subjunctive were)"},{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"لقبلت (لـ)","englishText":"would accept","role":"verb","explanation":"Modal conditional verb phrase"},{"arabicText":"ذلك العرض","englishText":"that offer","role":"object","explanation":"Demonstrative phrase"}],"habitHint":"Hypothetical advice takes the subjunctive: \"If I were you, I would...\". Never say \"If I am you I will\".","specificMisconceptions":[{"pattern":"\\bif i (am|will|would)\\b|\\bif (it|you|we|they|he|she) (will|would)\\b","diagnosis":"After if, don’t use will or would. Real future: if + present (If it rains). Unreal: if + past (If I were / had), then would in the result."}]},{"id":"ex-2-3-2","arabicThought":"لو كان لدي المزيد من الوقت لسافرت أكثر","englishTarget":"If I had more time I would travel more","acceptableAlternatives":["If I had more time I'd travel more"],"wordChips":["If","I","had","more","time","would","travel","will","have","traveled"],"breakdownChunks":[{"arabicText":"لو كان لدي وقت أكثر","englishText":"If I had more time","role":"connector","explanation":"Past form expressing present unreality"},{"arabicText":"لسافرت أكثر","englishText":"I would travel more","role":"verb","explanation":"Modal result"}],"habitHint":"Unreal present conditions shift the condition verb to the past (\"If I had\"), followed by \"would travel\".","specificMisconceptions":[{"pattern":"\\bif i (am|will|would)\\b|\\bif (it|you|we|they|he|she) (will|would)\\b","diagnosis":"After if, don’t use will or would. Real future: if + present (If it rains). Unreal: if + past (If I were / had), then would in the result."}]},{"id":"ex-2-3-3","arabicThought":"إذا أمطرت غداً سنلغي الرحلة","englishTarget":"If it rains tomorrow we will cancel the trip","acceptableAlternatives":["If it rains tomorrow we'll cancel the trip"],"wordChips":["If","it","rains","tomorrow","we","will","cancel","the","trip","would","rained"],"breakdownChunks":[{"arabicText":"إذا أمطرت غداً (واقعي)","englishText":"If it rains tomorrow","role":"connector","explanation":"Real first conditional (present tense)"},{"arabicText":"سنلغي الرحلة","englishText":"we will cancel the trip","role":"verb","explanation":"Future real consequence with \"will\""}],"habitHint":"For real possibilities in the future, use the present tense after \"if\" (\"If it rains\"), and \"will\" in the result.","specificMisconceptions":[{"pattern":"\\bif i (am|will|would)\\b|\\bif (it|you|we|they|he|she) (will|would)\\b","diagnosis":"After if, don’t use will or would. Real future: if + present (If it rains). Unreal: if + past (If I were / had), then would in the result."}]}]},{"id":"p2-l4","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":12,"title":"Contrast & Cause: Although, Because, and So","titleAr":"السببية والتعارض: Although و Because و So","transferConcept":"Arabic frequently doubles contrast markers (على الرغم من... لكنه / بسبب... لذلك). In English, a subordinating conjunction (Although / Because) binds the clauses on its own; inserting \"but\" or \"so\" creates an ungrammatical double-connector.","transferConceptAr":"العربية تجمع بين أداتي الربط معاً (بالرغم من كذا... لكنه كذا / بسبب كذا... لذلك كذا). الإنجليزية تمنع الازدواج: استخدم إما Although وحدها، أو But وحدها.","weakSpotTag":"double-connector","exercises":[{"id":"ex-2-2-12","arabicThought":"على الرغم من أنه كان متعباً، إلا أنه أنهى التقرير","englishTarget":"Although he was tired he finished the report","acceptableAlternatives":["Even though he was tired he finished the report","He finished the report although he was tired"],"wordChips":["Although","he","was","tired","finished","the","report","but","so","however"],"breakdownChunks":[{"arabicText":"على الرغم من أنه كان متعباً","englishText":"Although he was tired","role":"connector","explanation":"Subordinate clause of concession"},{"arabicText":"إلا أنه (محظور وضع but!)","englishText":"he","role":"subject","explanation":"Main clause subject"},{"arabicText":"أنهى","englishText":"finished","role":"verb","explanation":"Past verb"},{"arabicText":"التقرير","englishText":"the report","role":"object","explanation":"Direct object"}],"habitHint":"Never pair \"Although\" with \"but\". One connector controls the entire relationship.","specificMisconceptions":[{"pattern":"\\balthough .*\\b(but|however)\\b|\\bbecause .*\\b(so|therefore)\\b|\\bbut although\\b","diagnosis":"English uses one connector per relationship. Although … but and Because … so are double connectors that Arabic allows but English doesn’t."}]},{"id":"ex-2-4-2","arabicThought":"لأنه كان مريضاً، لم يتمكن من حضور الحفل","englishTarget":"Because he was sick he could not attend the party","acceptableAlternatives":["Because he was sick he couldn't attend the party","He could not attend the party because he was sick"],"wordChips":["Because","he","was","sick","could","not","attend","the","party","so","therefore"],"breakdownChunks":[{"arabicText":"لأنه كان مريضاً","englishText":"Because he was sick","role":"connector","explanation":"Causal subordinate clause"},{"arabicText":"لم يتمكن من حضور الحفل","englishText":"he could not attend the party","role":"verb","explanation":"Main clause (do not add \"so\"!)"}],"habitHint":"If you start with \"Because\", never put \"so\" in the middle of the sentence.","specificMisconceptions":[{"pattern":"\\balthough .*\\b(but|however)\\b|\\bbecause .*\\b(so|therefore)\\b|\\bbut although\\b","diagnosis":"English uses one connector per relationship. Although … but and Because … so are double connectors that Arabic allows but English doesn’t."}]},{"id":"ex-2-4-3","arabicThought":"فاتني القطار، ولذلك وصلت متأخراً","englishTarget":"I missed the train so I arrived late","acceptableAlternatives":["I missed the train and so I arrived late"],"wordChips":["I","missed","the","train","so","arrived","late","because","although"],"breakdownChunks":[{"arabicText":"فاتني القطار","englishText":"I missed the train","role":"subject","explanation":"Cause"},{"arabicText":"ولذلك","englishText":"so","role":"connector","explanation":"Coordinating conjunction of result"},{"arabicText":"وصلت متأخراً","englishText":"I arrived late","role":"verb","explanation":"Effect"}],"habitHint":"When connecting independent cause and effect, \"so\" stands cleanly between the two clauses.","specificMisconceptions":[{"pattern":"\\balthough .*\\b(but|however)\\b|\\bbecause .*\\b(so|therefore)\\b|\\bbut although\\b","diagnosis":"English uses one connector per relationship. Although … but and Because … so are double connectors that Arabic allows but English doesn’t."}]}]},{"id":"p2-l5","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":13,"title":"Phrasal Verbs & Spatial Particle Logic","titleAr":"الأفعال المركبة (Phrasal Verbs) والمنطق الحركي","transferConcept":"Arabic verbs usually carry their semantic shift through internal morphological patterns (أطفأ vs انطفأ). English shifts meaning by snapping spatial prepositions/particles onto simple base verbs (turn + off, give + up, run + out of).","transferConceptAr":"العربية تشتق المعاني من أوزان الأفعال الصرفية (أطفأ، استسلم). الإنجليزية تعتمد على دمج الفعل الأساسي مع حرف مكان يغير المعنى بالكامل: turn off (يطفئ)، give up (يستسلم).","weakSpotTag":"phrasal-verbs","exercises":[{"id":"ex-2-5-1","arabicThought":"رجاءً أطفئ الأنوار قبل أن تغادر","englishTarget":"Please turn off the lights before you leave","acceptableAlternatives":["Please switch off the lights before you leave","Turn off the lights please before you leave"],"wordChips":["Please","turn","off","the","lights","before","you","leave","close","shut","out"],"breakdownChunks":[{"arabicText":"رجاءً","englishText":"Please","role":"modifier","explanation":"Politeness marker"},{"arabicText":"أطفئ","englishText":"turn off","role":"verb","explanation":"Phrasal verb (never \"close the lights\"!)"},{"arabicText":"الأنوار","englishText":"the lights","role":"object","explanation":"Direct object"},{"arabicText":"قبل أن تغادر","englishText":"before you leave","role":"connector","explanation":"Time clause"}],"habitHint":"In Arabic, speakers often say \"أغلق النور\" and translate it literally as \"close the lights\". In English, devices and electricity take \"turn off\" or \"switch off\".","specificMisconceptions":[{"pattern":"\\b(close|open|shut) the lights?\\b|\\bfinished from us\\b|\\bsurrender\\b","diagnosis":"Devices and electricity use phrasal verbs: turn off / switch off, not close. For running out of something use run out of."}]},{"id":"ex-2-5-2","arabicThought":"لقد نفد منا البنزين في منتصف الطريق","englishTarget":"We ran out of gas in the middle of the road","acceptableAlternatives":["We ran out of petrol in the middle of the road","We have run out of gas in the middle of the road"],"wordChips":["We","ran","out","of","gas","in","the","middle","road","finished","petrol"],"breakdownChunks":[{"arabicText":"نفد منا","englishText":"We ran out of","role":"verb","explanation":"Three-part phrasal verb meaning depletion"},{"arabicText":"البنزين","englishText":"gas","role":"object","explanation":"Depleted resource"},{"arabicText":"في منتصف الطريق","englishText":"in the middle of the road","role":"connector","explanation":"Locational idiom"}],"habitHint":"To say something was depleted, use the phrasal verb \"run out of\", not \"gas finished from us\".","specificMisconceptions":[{"pattern":"\\b(close|open|shut) the lights?\\b|\\bfinished from us\\b|\\bsurrender\\b","diagnosis":"Devices and electricity use phrasal verbs: turn off / switch off, not close. For running out of something use run out of."}]},{"id":"ex-2-5-3","arabicThought":"لا تستسلم أبداً مهما كانت الصعوبات","englishTarget":"Never give up no matter the difficulties","acceptableAlternatives":["Do not ever give up no matter the difficulties","Never give up whatever the difficulties"],"wordChips":["Never","give","up","no","matter","the","difficulties","surrender","down","in"],"breakdownChunks":[{"arabicText":"لا ... أبداً","englishText":"Never","role":"modifier","explanation":"Emphatic negative frequency adverb"},{"arabicText":"تستسلم","englishText":"give up","role":"verb","explanation":"Idiomatic phrasal verb"},{"arabicText":"مهما كانت الصعوبات","englishText":"no matter the difficulties","role":"connector","explanation":"Concessive adverbial phrase"}],"habitHint":"The everyday natural English expression for \"استسلم\" is the phrasal verb \"give up\".","specificMisconceptions":[{"pattern":"\\b(close|open|shut) the lights?\\b|\\bfinished from us\\b|\\bsurrender\\b","diagnosis":"Devices and electricity use phrasal verbs: turn off / switch off, not close. For running out of something use run out of."}]}]},{"id":"p2-l6","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":14,"title":"Countable vs Uncountable Mass Nouns","titleAr":"الأسماء المعدودة وغير المعدودة وفخ الجمع (نصائح، معلومات)","transferConcept":"In Arabic, words like \"معلومات\", \"نصائح\", and \"أثاث\" are plural countable nouns. In English, information, advice, furniture, luggage, and homework are strictly singular uncountable mass nouns (they never take an -s or \"a\").","transferConceptAr":"العربية تجمع كلمات مثل \"نصائح\" و\"معلومات\" و\"أثاث\". في الإنجليزية، هذه الكلمات أسماء غير معدودة مصمتة (Mass Nouns): لا تُجمع بإضافة s ولا تأخذ أداة a بمفردها.","weakSpotTag":"uncountable-nouns","exercises":[{"id":"ex-2-6-1","arabicThought":"أعطاني المدير بعض النصائح المفيدة","englishTarget":"The manager gave me some useful advice","acceptableAlternatives":["The boss gave me some useful advice","The manager provided me with some useful advice"],"wordChips":["The","manager","gave","me","some","useful","advice","advices","an","tips"],"breakdownChunks":[{"arabicText":"المدير","englishText":"The manager","role":"subject","explanation":"Subject"},{"arabicText":"أعطاني","englishText":"gave me","role":"verb","explanation":"Ditransitive verb"},{"arabicText":"بعض النصائح المفيدة","englishText":"some useful advice","role":"object","explanation":"Uncountable noun: NEVER \"advices\"!"}],"habitHint":"\"Advice\" in English is always uncountable. Never say \"an advice\" or \"advices\". Use \"some advice\" or \"a piece of advice\".","specificMisconceptions":[{"pattern":"\\b(advices|informations|furnitures|luggages|homeworks|an advice|an information)\\b|\\b(these|those) information\\b|\\binformation are\\b","diagnosis":"advice, information and furniture are uncountable: no -s, no a / an, and a singular verb (This information is…)."}]},{"id":"ex-2-6-2","arabicThought":"هذه المعلومات سرية للغاية","englishTarget":"This information is strictly confidential","acceptableAlternatives":["This information is very confidential","This information is highly confidential"],"wordChips":["This","information","is","strictly","confidential","These","are","informations"],"breakdownChunks":[{"arabicText":"هذه المعلومات","englishText":"This information","role":"subject","explanation":"Singular demonstrative \"This\" with mass noun"},{"arabicText":"تكون","englishText":"is","role":"verb","explanation":"Singular copula \"is\" (NOT \"are\"!)"},{"arabicText":"سرية للغاية","englishText":"strictly confidential","role":"modifier","explanation":"Collocation adverb + adjective"}],"habitHint":"Even though Arabic says \"هذه المعلومات\" (plural thought), English treats \"information\" as singular: say \"This information IS\", never \"These informations are\".","specificMisconceptions":[{"pattern":"\\b(advices|informations|furnitures|luggages|homeworks|an advice|an information)\\b|\\b(these|those) information\\b|\\binformation are\\b","diagnosis":"advice, information and furniture are uncountable: no -s, no a / an, and a singular verb (This information is…)."}]},{"id":"ex-2-6-3","arabicThought":"اشترينا أثاثاً جديداً لغرفة المعيشة","englishTarget":"We bought new furniture for the living room","acceptableAlternatives":["We bought some new furniture for the living room"],"wordChips":["We","bought","new","furniture","for","the","living","room","furnitures","a"],"breakdownChunks":[{"arabicText":"نحن اشترينا","englishText":"We bought","role":"verb","explanation":"Subject and action"},{"arabicText":"أثاثاً جديداً","englishText":"new furniture","role":"object","explanation":"Mass noun with no plural suffix"},{"arabicText":"لغرفة المعيشة","englishText":"for the living room","role":"connector","explanation":"Prepositional phrase"}],"habitHint":"\"Furniture\" represents the whole collection as a mass. Never write \"furnitures\".","specificMisconceptions":[{"pattern":"\\b(advices|informations|furnitures|luggages|homeworks|an advice|an information)\\b|\\b(these|those) information\\b|\\binformation are\\b","diagnosis":"advice, information and furniture are uncountable: no -s, no a / an, and a singular verb (This information is…)."}]}]},{"id":"p2-l7","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":15,"title":"Gerunds vs Infinitives After Prepositions","titleAr":"اسم الفاعل (Gerund) والمصدر بعد حروف الجر","transferConcept":"In Arabic, prepositions can easily be followed by verbal nouns (المصدر الصريح) or \"أن\" + verb. In English, ANY verb immediately following ANY preposition must take the -ing form (gerund), including expressions like \"look forward to\".","transferConceptAr":"في العربية يمكن وضع المصدر بعد حروف الجر بسهولة. في الإنجليزية، أي فعل يقع مباشرة بعد حرف جر يجب حتماً أن ينتهي بـ -ing (Gerund)، حتى في عبارات مثل look forward to.","weakSpotTag":"gerund-preposition","exercises":[{"id":"ex-2-7-1","arabicThought":"أنا أتطلع بشوق إلى لقائك قريباً","englishTarget":"I look forward to meeting you soon","acceptableAlternatives":["I'm looking forward to meeting you soon","I look forward to seeing you soon"],"wordChips":["I","look","forward","to","meeting","you","soon","meet","to meet","see"],"breakdownChunks":[{"arabicText":"أنا أتطلع بشوق إلى","englishText":"I look forward to","role":"verb","explanation":"\"to\" here is a preposition, NOT an infinitive marker!"},{"arabicText":"لقائك","englishText":"meeting you","role":"object","explanation":"Gerund (-ing) required after the preposition"},{"arabicText":"قريباً","englishText":"soon","role":"modifier","explanation":"Adverb"}],"habitHint":"In \"look forward to\", the word \"to\" is a preposition! Therefore, the following verb MUST take -ing: \"meeting you\", NOT \"meet you\".","specificMisconceptions":[{"pattern":"\\bforward to (meet|see|hear|work|visit)\\b|\\binterested in (learn|study|read|meet)\\b|\\bfor (help|to help)\\b","diagnosis":"After any preposition the verb takes -ing. Careful: the “to” in look forward to is a preposition."}]},{"id":"ex-2-7-2","arabicThought":"هو مهتم بتعلم لغات جديدة","englishTarget":"He is interested in learning new languages","acceptableAlternatives":["He's interested in learning new languages"],"wordChips":["He","is","interested","in","learning","new","languages","to","learn","at"],"breakdownChunks":[{"arabicText":"هو مهتم بـ","englishText":"He is interested in","role":"verb","explanation":"Adjective + preposition collocation"},{"arabicText":"تعلم","englishText":"learning","role":"object","explanation":"Verb after \"in\" takes -ing"},{"arabicText":"لغات جديدة","englishText":"new languages","role":"object","explanation":"Modifier + plural noun"}],"habitHint":"Any verb right after the preposition \"in\" must end in -ing (\"learning\").","specificMisconceptions":[{"pattern":"\\bforward to (meet|see|hear|work|visit)\\b|\\binterested in (learn|study|read|meet)\\b|\\bfor (help|to help)\\b","diagnosis":"After any preposition the verb takes -ing. Careful: the “to” in look forward to is a preposition."}]},{"id":"ex-2-7-3","arabicThought":"شكراً لمساعدتي في هذه المشكلة","englishTarget":"Thank you for helping me with this problem","acceptableAlternatives":["Thanks for helping me with this problem"],"wordChips":["Thank","you","for","helping","me","with","this","problem","help","to","in"],"breakdownChunks":[{"arabicText":"شكراً لك","englishText":"Thank you","role":"verb","explanation":"Formulaic thanks"},{"arabicText":"على مساعدتي","englishText":"for helping me","role":"connector","explanation":"Preposition \"for\" + gerund \"helping\""},{"arabicText":"في هذه المشكلة","englishText":"with this problem","role":"modifier","explanation":"Prepositional complement"}],"habitHint":"After \"for\", the verb takes -ing: \"for helping me\".","specificMisconceptions":[{"pattern":"\\bforward to (meet|see|hear|work|visit)\\b|\\binterested in (learn|study|read|meet)\\b|\\bfor (help|to help)\\b","diagnosis":"After any preposition the verb takes -ing. Careful: the “to” in look forward to is a preposition."}]}]},{"id":"p2-l8","phaseId":2,"phaseTitle":"Flow & Nuance","phaseLevel":"B1 – B2","number":16,"title":"Passive Voice & Agent Demotion (المبني للمجهول)","titleAr":"المبني للمجهول وتغيير بؤرة الاهتمام في الجملة","transferConcept":"Arabic builds passive voice primarily through internal vowel shifting (كُتِبَ / يُكْتَبُ) without extra auxiliary verbs. English builds the passive with two distinct moving parts: an explicit form of \"to be\" + Past Participle (was written / is being built).","transferConceptAr":"العربية تصوغ المبني للمجهول بحركات الحروف وتغيير البنية الصرفية (كُسِرَ، أُغلِقَ). الإنجليزية تتطلب تركيباً مركباً: تصريف مناسب لفعل to be + التصريف الثالث (was broken).","weakSpotTag":"passive-construction","exercises":[{"id":"ex-2-8-1","arabicThought":"كُسرت النافذة أثناء العاصفة الليلة الماضية","englishTarget":"The window was broken during the storm last night","acceptableAlternatives":["During the storm last night the window was broken"],"wordChips":["The","window","was","broken","during","the","storm","last","night","is","broke"],"breakdownChunks":[{"arabicText":"النافذة","englishText":"The window","role":"subject","explanation":"Patient promoted to subject"},{"arabicText":"كُسرت (مبني للمجهول)","englishText":"was broken","role":"verb","explanation":"Past copula \"was\" + past participle \"broken\""},{"arabicText":"أثناء العاصفة الليلة الماضية","englishText":"during the storm last night","role":"connector","explanation":"Time and event prepositional phrase"}],"habitHint":"Arabic changes the vowels (كُسِرت). English requires the past auxiliary \"was\" plus the participle \"broken\".","specificMisconceptions":[{"pattern":"\\bwas (break|send|write|build|broke|wrote)\\b","diagnosis":"After was / were use the past participle (broken, sent, written), not the base or past form."},{"pattern":"\\bis (building|build|builded)\\b","diagnosis":"For an action in progress use is being + past participle: is being built."}]},{"id":"ex-2-8-2","arabicThought":"يتم بناء هذا الجسر في الوقت الحالي","englishTarget":"This bridge is being built right now","acceptableAlternatives":["This bridge is being built currently"],"wordChips":["This","bridge","is","being","built","right","now","is building","builded","at"],"breakdownChunks":[{"arabicText":"هذا الجسر","englishText":"This bridge","role":"subject","explanation":"Subject"},{"arabicText":"يتم بناؤه حالياً","englishText":"is being built","role":"verb","explanation":"Present continuous passive: is + being + V3"},{"arabicText":"في الوقت الحالي","englishText":"right now","role":"connector","explanation":"Time anchor"}],"habitHint":"For continuous passive, English pairs \"is being\" with the participle \"built\".","specificMisconceptions":[{"pattern":"\\bwas (break|send|write|build|broke|wrote)\\b","diagnosis":"After was / were use the past participle (broken, sent, written), not the base or past form."},{"pattern":"\\bis (building|build|builded)\\b","diagnosis":"For an action in progress use is being + past participle: is being built."},{"pattern":"\\bactually\\b","diagnosis":"“actually” means in fact (the false friend). It does not mean حالياً. For now / at this moment use currently or right now."}]},{"id":"ex-2-8-3","arabicThought":"أُرسلت الرسالة عن طريق الخطأ","englishTarget":"The message was sent by mistake","acceptableAlternatives":["The email was sent by mistake","The letter was sent by mistake"],"wordChips":["The","message","was","sent","by","mistake","is","send","with"],"breakdownChunks":[{"arabicText":"الرسالة","englishText":"The message","role":"subject","explanation":"Subject"},{"arabicText":"أُرسلت","englishText":"was sent","role":"verb","explanation":"Past passive verb phrase"},{"arabicText":"عن طريق الخطأ","englishText":"by mistake","role":"connector","explanation":"Prepositional idiom of manner"}],"habitHint":"Past passive takes \"was sent\", followed by the idiom \"by mistake\".","specificMisconceptions":[{"pattern":"\\bwas (break|send|write|build| :"such extraordinary dedication","role":"object","explanation":"Intensifier + adjective + abstract noun"}],"habitHint":"Starting with \"Seldom\" forces question-style inversion: \"Seldom do we see...\", NOT \"Seldom we see\".","specificMisconceptions":[{"pattern":"^(seldom|rarely|little|never|hardly|scarcely) (we|i|they|he|she|you) |^under no circumstances (this|it|you|we|they|the) ","diagnosis":"After a fronted negative or limiting phrase (Seldom, Little, Under no circumstances) English inverts like a question: Seldom do we see…, Under no circumstances should…"}]},{"id":"ex-3-1-2","arabicThought":"لم أكن أعلم قط أن الحقيقة ستتكشف بهذا الشكل","englishTarget":"Little did I know that the truth would unfold like this","acceptableAlternatives":["Little did I know that the truth would be revealed like this"],"wordChips":["Little","did","I","know","that","the","truth","would","unfold","like","this","I knew"],"breakdownChunks":[{"arabicText":"لم أكن أعلم قط","englishText":"Little did I know","role":"auxiliary","explanation":"Formal idiomatic inversion formula"},{"arabicText":"أن الحقيقة ستتكشف بهذا الشكل","englishText":"that the truth would unfold like this","role":"object","explanation":"Noun clause with backshifted modal"}],"habitHint":"Opening with \"Little\" triggers inversion with past auxiliary: \"Little did I know\", not \"Little I knew\".","specificMisconceptions":[{"pattern":"^(seldom|rarely|little|never|hardly|scarcely) (we|i|they|he|she|you) |^under no circumstances (this|it|you|we|they|the) ","diagnosis":"After a fronted negative or limiting phrase (Seldom, Little, Under no circumstances) English inverts like a question: Seldom do we see…, Under no circumstances should…"}]},{"id":"ex-3-1-3","arabicThought":"لا ينبغي تحت أي ظرف من الظروف انتهاك هذه السياسة","englishTarget":"Under no circumstances should this policy be violated","acceptableAlternatives":["Under no circumstances must this policy be violated"],"wordChips":["Under","no","circumstances","should","this","policy","be","violated","this policy should","not"],"breakdownChunks":[{"arabicText":"تحت أي ظرف من الظروف (نفي مطلق)","englishText":"Under no circumstances","role":"connector","explanation":"Fronted negative prepositional phrase"},{"arabicText":"لا ينبغي انتهاك هذه السياسة","englishText":"should this policy be violated","role":"verb","explanation":"Inverted modal + subject + passive infinitive"}],"habitHint":"After \"Under no circumstances\", invert the modal: \"should this policy be violated\".","specificMisconceptions":[{"pattern":"^(seldom|rarely|little|never|hardly|scarcely) (we|i|they|he|she|you) |^under no circumstances (this|it|you|we|they|the) ","diagnosis":"After a fronted negative or limiting phrase (Seldom, Little, Under no circumstances) English inverts like a question: Seldom do we see…, Under no circumstances should…"}]}]},{"id":"p3-l2","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":18,"title":"Reported Speech & Tense Backshifting (تطابق الأزمنة)","titleAr":"الكلام المنقول والتراجع الزمني (Backshifting)","transferConcept":"In Arabic, reported speech often keeps the direct tense intact (قال إنه مشغول الآن = \"He said he IS busy\"). In standard English, if the reporting verb is in the past (\"He said\"), all subordinate verbs must backshift into past harmony (He said he WAS busy).","transferConceptAr":"في العربية، يحتفظ الكلام المنقول بزمنه الأصلي (قال إنه مسافر غداً). في الإنجليزية، إذا كان فعل القول ماضياً (He said)، يجب إرجاع زمن الجملة التابعة خطوة للماضي لتحقيق التناغم الزمني (He said he was traveling).","weakSpotTag":"backshifting-error","exercises":[{"id":"ex-3-2-1","arabicThought":"أخبرني أنه مشغول جداً بمشروع جديد","englishTarget":"He told me that he was very busy with a new project","acceptableAlternatives":["He told me he was very busy with a new project"],"wordChips":["He","told","me","that","he","was","very","busy","with","a","new","project","is"],"breakdownChunks":[{"arabicText":"أخبرني","englishText":"He told me","role":"verb","explanation":"Reporting clause in past tense"},{"arabicText":"أنه مشغول (تراجع زمني)","englishText":"that he was very busy","role":"subject","explanation":"Backshifted copula: \"is\" becomes \"was\""},{"arabicText":"بمشروع جديد","englishText":"with a new project","role":"connector","explanation":"Prepositional phrase"}],"habitHint":"Arabic preserves \"مشغول\" in the present, but because the reporting verb is \"told\" (past), English requires backshifting: \"he was busy\", NOT \"he is busy\".","specificMisconceptions":[{"pattern":"\\b(said|told me|told us|confirmed|explained) (that )?(he|she|they|i|we) (is|are|will|has|have|can)\\b","diagnosis":"After a past reporting verb English steps the tense back: is → was, will → would, have received → had received."}]},{"id":"ex-3-2-2","arabicThought":"قالت إنها ستنهي المهمة قبل الموعد النهائي","englishTarget":"She said she would finish the task before the deadline","acceptableAlternatives":["She said that she would finish the task before the deadline"],"wordChips":["She","said","she","would","finish","the","task","before","deadline","will","that"],"breakdownChunks":[{"arabicText":"قالت","englishText":"She said","role":"verb","explanation":"Past reporting verb"},{"arabicText":"إنها ستنهي","englishText":"she would finish","role":"verb","explanation":"Future in the past: \"will\" backshifts to \"would\""},{"arabicText":"المهمة قبل الموعد النهائي","englishText":"the task before the deadline","role":"object","explanation":"Object phrase and temporal limit"}],"habitHint":"After \"said\", \"will\" must backshift to \"would\".","specificMisconceptions":[{"pattern":"\\b(said|told me|told us|confirmed|explained) (that )?(he|she|they|i|we) (is|are|will|has|have|can)\\b","diagnosis":"After a past reporting verb English steps the tense back: is → was, will → would, have received → had received."}]},{"id":"ex-3-2-3","arabicThought":"أكدوا أنهم قد استلموا جميع المستندات المطلوبة","englishTarget":"They confirmed that they had received all the required documents","acceptableAlternatives":["They confirmed they had received all required documents"],"wordChips":["They","confirmed","that","they","had","received","all","the","required","documents","have"],"breakdownChunks":[{"arabicText":"أكدوا","englishText":"They confirmed","role":"verb","explanation":"Reporting verb"},{"arabicText":"أنهم قد استلموا","englishText":"that they had received","role":"verb","explanation":"Past perfect backshift from have received"},{"arabicText":"جميع المستندات المطلوبة","englishText":"all the required documents","role":"object","explanation":"Noun phrase"}],"habitHint":"Present perfect (\"have received\") backshifts to Past Perfect (\"had received\") following the past reporting verb \"confirmed\".","specificMisconceptions":[{"pattern":"\\b(said|told me|told us|confirmed|explained) (that )?(he|she|they|i|we) (is|are|will|has|have|can)\\b","diagnosis":"After a past reporting verb English steps the tense back: is → was, will → would, have received → had received."}]}]},{"id":"p3-l3","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":19,"title":"Nuanced Modals: Deduction & Regret (Past Modals)","titleAr":"أفعال الاستنتاج والندم في الماضي (Should have / Must have)","transferConcept":"Arabic speakers often express past regret or deduction by prefixing \"كان يجب\" or \"لا بد أنه\" followed by a present verb. In English, modal deduction in the past demands the formula: Modal + have + Past Participle (should have called, must have known).","transferConceptAr":"العربية تصوغ الندم أو الاستنتاج الماضي بتركيب \"كان يجب أن\" متبوعاً بفعل مضارع. الإنجليزية تتبع صيغة ثابتة لا تتغير: Modal + have + V3 (مثل should have called / must have known).","weakSpotTag":"past-modals","exercises":[{"id":"ex-3-19-1","arabicThought":"كان يجب أن تخبرني عن التغيير في وقت سابق","englishTarget":"You should have told me about the change earlier","acceptableAlternatives":["You should've told me about the change earlier","You ought to have told me about the change earlier"],"wordChips":["You","should","have","told","me","about","the","change","earlier","must","tell","had"],"breakdownChunks":[{"arabicText":"أنت","englishText":"You","role":"subject","explanation":"Subject"},{"arabicText":"كان يجب أن تخبرني","englishText":"should have told me","role":"verb","explanation":"Modal of past regret: should + have + V3 + pronoun"},{"arabicText":"عن التغيير","englishText":"about the change","role":"object","explanation":"Topic"},{"arabicText":"في وقت سابق","englishText":"earlier","role":"modifier","explanation":"Comparative adverb"}],"habitHint":"To express \"كان يجب أن تفعل\", the English blueprint is strictly \"should have + past participle\" (\"should have told\").","specificMisconceptions":[{"pattern":"\\b(should|could|would|must) of\\b|\\b(should|could|would|must) have (went|did|saw|took|knew|came|wrote)\\b","diagnosis":"Past modals take have + past participle: should have gone, could have done, never should of or have went."}]},{"id":"ex-3-19-2","arabicThought":"لا بد أنه قد نسي موعد الاجتماع","englishTarget":"He must have forgotten the meeting appointment","acceptableAlternatives":["He must have forgotten about the meeting","He must've forgotten about the meeting"],"wordChips":["He","must","have","forgotten","the","meeting","appointment","about","forgot","had"],"breakdownChunks":[{"arabicText":"هو","englishText":"He","role":"subject","explanation":"Subject"},{"arabicText":"لا بد أنه نسي (استنتاج شبه يقيني)","englishText":"must have forgotten","role":"verb","explanation":"Modal of past deduction: must + have + V3"},{"arabicText":"موعد الاجتماع","englishText":"the meeting appointment","role":"object","explanation":"Noun adjunct phrase"}],"habitHint":"Past logical deduction (\"لا بد أنه فعل\") translates to \"must have + V3\" (\"must have forgotten\").","specificMisconceptions":[{"pattern":"\\b(should|could|would|must) of\\b|\\b(should|could|would|must) have (went|did|saw|took|

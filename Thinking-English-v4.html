is a decisive decision"],"wordChips":["All","we","need","now","is","a","decisive","decision","are","the","What"],"breakdownChunks":[{"arabicText":"كل ما نحتاجه الآن","englishText":"All we need now","role":"subject","explanation":"Restrictive focus subject phrase"},{"arabicText":"هو","englishText":"is","role":"verb","explanation":"Singular linking verb"},{"arabicText":"قرار حاسم","englishText":"a decisive decision","role":"object","explanation":"Focused complement"}],"habitHint":"Use \"All we need now is...\" to spotlight a single necessity."}]},{"id":"p3-l5","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":21,"title":"The Subjunctive & Formal Directives","titleAr":"صيغة الإلزام والاقتراح الرسمي (The Mandative Subjunctive)","transferConcept":"In formal administrative English after verbs of demand or recommendation (recommend, insist, propose, demand), the that-clause uses the base verb with NO third-person -s and NO modal (I suggest that he BE present, not \"is present\" or \"should be\").","transferConceptAr":"في الإنجليزية الرسمية الرفيعة بعد أفعال الاقتراح والطلب (suggest, recommend, insist)، الفعل التابع يأتي مجرداً تماماً حتى مع he/she دون إضافة s وبدون to (نقول: I suggest that he attend وليس attends).","weakSpotTag":"mandative-subjunctive","exercises":[{"id":"ex-3-21-1","arabicThought":"أقترح أن يحضر الاجتماع شخصياً","englishTarget":"I suggest that he attend the meeting in person","acceptableAlternatives":["I recommend that he attend the meeting in person","I suggest he attend the meeting in person"],"wordChips":["I","suggest","that","he","attend","the","meeting","in","person","attends","should","to"],"breakdownChunks":[{"arabicText":"أقترح","englishText":"I suggest","role":"verb","explanation":"Mandative verb"},{"arabicText":"أن يحضر هو (صيغة الإلزام)","englishText":"that he attend","role":"subject","explanation":"Subjunctive base form without third-person -s!"},{"arabicText":"الاجتماع","englishText":"the meeting","role":"object","explanation":"Direct object"},{"arabicText":"شخصياً","englishText":"in person","role":"modifier","explanation":"Idiomatic prepositional phrase"}],"habitHint":"In the formal mandative subjunctive, \"attend\" does NOT take an -s even after \"he\": \"that he attend\".","specificMisconceptions":[{"pattern":"\\b(suggest|recommend|insist|demand|propose|require)(ed|s)? that (he|she|it|you|they|we|i) (\\w+s|will|to)\\b","diagnosis":"After suggest / recommend / insist that, formal English uses the bare verb: that he come, that she be, not comes or to come."}]},{"id":"ex-3-21-2","arabicThought":"من الضروري أن تكون التقارير دقيقة","englishTarget":"It is essential that the reports be accurate","acceptableAlternatives":["It is vital that the reports be accurate","It is essential that the reports should be accurate"],"wordChips":["It","is","essential","that","the","reports","be","accurate","are","must","were"],"breakdownChunks":[{"arabicText":"من الضروري","englishText":"It is essential","role":"modifier","explanation":"Impersonal adjective of necessity"},{"arabicText":"أن تكون التقارير","englishText":"that the reports be","role":"verb","explanation":"Subjunctive base \"be\" instead of \"are\""},{"arabicText":"دقيقة","englishText":"accurate","role":"object","explanation":"Predicate adjective"}],"habitHint":"After \"essential that\", use the bare copula \"be\", not \"are\": \"that the reports be accurate\".","specificMisconceptions":[{"pattern":"\\b(suggest|recommend|insist|demand|propose|require)(ed|s)? that (he|she|it|you|they|we|i) (\\w+s|will|to)\\b","diagnosis":"After suggest / recommend / insist that, formal English uses the bare verb: that he come, that she be, not comes or to come."}]},{"id":"ex-3-21-3","arabicThought":"أصرت اللجنة على أن يستقيل المدير على الفور","englishTarget":"The committee insisted that the manager resign immediately","acceptableAlternatives":["The committee insisted that the director resign immediately"],"wordChips":["The","committee","insisted","that","the","manager","resign","immediately","resigns","resigned"],"breakdownChunks":[{"arabicText":"أصرت اللجنة","englishText":"The committee insisted","role":"subject","explanation":"Main clause"},{"arabicText":"على أن يستقيل المدير","englishText":"that the manager resign","role":"verb","explanation":"Subjunctive base verb \"resign\""},{"arabicText":"على الفور","englishText":"immediately","role":"modifier","explanation":"Adverb of immediacy"}],"habitHint":"After \"insisted that\", use the base verb \"resign\" without -s or past tense.","specificMisconceptions":[{"pattern":"\\b(suggest|recommend|insist|demand|propose|require)(ed|s)? that (he|she|it|you|they|we|i) (\\w+s|will|to)\\b","diagnosis":"After suggest / recommend / insist that, formal English uses the bare verb: that he come, that she be, not comes or to come."}]}]},{"id":"p3-l6","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":22,"title":"Discourse Markers & Transition in High Register","titleAr":"أدوات الربط والمناقلة في الخطاب الرفيع (Furthermore, Nonetheless)","transferConcept":"Arabic links flowing paragraphs with \"وعلاوة على ذلك\" or \"ومن ناحية أخرى\". In high-register English, discourse markers (Furthermore, Moreover, Nonetheless, In contrast) set the logical cadence and are set off by mandatory commas.","transferConceptAr":"العربية تربط الفقرات بسلاسة باستخدام الواو وعلاوة على ذلك. في الإنجليزية الأكاديمية والمهنية، أدوات مثل Furthermore و Nonetheless هي بوصلة المنطق وتُتبع بفاصلة حاسمة.","weakSpotTag":"discourse-markers","exercises":[{"id":"ex-3-22-1","arabicThought":"علاوة على ذلك، فإن النتائج الأولية غير حاسمة","englishTarget":"Furthermore the preliminary results are inconclusive","acceptableAlternatives":["Moreover the preliminary results are inconclusive","Additionally the preliminary results are inconclusive"],"wordChips":["Furthermore","the","preliminary","results","are","inconclusive","Moreover","is","conclusive","also"],"breakdownChunks":[{"arabicText":"علاوة على ذلك","englishText":"Furthermore","role":"connector","explanation":"Formal additive discourse marker"},{"arabicText":"النتائج الأولية","englishText":"the preliminary results","role":"subject","explanation":"Plural subject noun phrase"},{"arabicText":"تكون","englishText":"are","role":"verb","explanation":"Plural copula"},{"arabicText":"غير حاسمة","englishText":"inconclusive","role":"object","explanation":"High-register negative prefix adjective"}],"habitHint":"Elevate your register from simple \"also\" or \"and\" to \"Furthermore\" or \"Moreover\" when opening an argumentative point."},{"id":"ex-3-22-2","arabicThought":"ومع ذلك، لا تزال هناك عقبات رئيسية يجب التغلب عليها","englishTarget":"Nonetheless there remain significant obstacles to overcome","acceptableAlternatives":["Nevertheless there remain significant obstacles to overcome","Nonetheless there are still major obstacles to overcome"],"wordChips":["Nonetheless","there","remain","significant","obstacles","to","overcome","However","is","obstacle"],"breakdownChunks":[{"arabicText":"ومع ذلك","englishText":"Nonetheless","role":"connector","explanation":"Concessive transition"},{"arabicText":"لا تزال هناك","englishText":"there remain","role":"verb","explanation":"Elevated existential verb replacing \"there are\""},{"arabicText":"عقبات رئيسية","englishText":"significant obstacles","role":"subject","explanation":"Formal adjective + noun"},{"arabicText":"يجب التغلب عليها","englishText":"to overcome","role":"modifier","explanation":"Infinitive modifier"}],"habitHint":"\"Nonetheless\" or \"Nevertheless\" provides a nuanced, professional counterpoint."},{"id":"ex-3-22-3","arabicThought":"وبالتالي، يتعين علينا مراجعة استراتيجيتنا بالكامل","englishTarget":"Consequently we must review our strategy completely","acceptableAlternatives":["Therefore we must review our strategy completely","Consequently we have to reconsider our entire strategy"],"wordChips":["Consequently","we","must","review","our","strategy","completely","So","Therefore","to"],"breakdownChunks":[{"arabicText":"وبالتالي","englishText":"Consequently","role":"connector","explanation":"Formal illative cause-and-effect marker"},{"arabicText":"يتعين علينا مراجعة","englishText":"we must review","role":"verb","explanation":"Modal + transitive verb"},{"arabicText":"استراتيجيتنا بالكامل","englishText":"our strategy completely","role":"object","explanation":"Direct object + adverb"}],"habitHint":"Replace colloquial \"so\" with \"Consequently\" or \"Therefore\" for executive-level impact."}]},{"id":"p3-l7","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":23,"title":"False Friends & Cognitive False Cognates","titleAr":"الأصدقاء الخادعون (False Friends) والأوهام اللغوية","transferConcept":"Arabic speakers often get tricked by deceptive vocabulary pairs: translating \"actually\" as حالياً (it actually means في الحقيقة), \"sympathetic\" as لطيف (it means متعاطف), or \"eventually\" as في النهاية (often confused with احتمالاً).","transferConceptAr":"يقع المتعلم في فخ كلمات خادعة: \"actually\" لا تعني حالياً بل \"في الواقع\"، و\"sympathetic\" لا تعني لطيف بل \"متعاطف\"، و\"eventually\" تعني \"في نهاية المطاف\".","weakSpotTag":"false-friends","exercises":[{"id":"ex-3-23-1","arabicThought":"في الواقع، لست متفقاً تماماً مع هذا المقترح","englishTarget":"Actually I do not entirely agree with this proposal","acceptableAlternatives":["Actually I don't entirely agree with this proposal","In reality I do not entirely agree with this proposal"],"wordChips":["Actually","I","do","not","entirely","agree","with","this","proposal","Currently","am","agreeing"],"breakdownChunks":[{"arabicText":"في الواقع","englishText":"Actually","role":"connector","explanation":"Meaning \"as a matter of fact\" (NOT currently!)"},{"arabicText":"لست متفقاً تماماً","englishText":"I do not entirely agree","role":"verb","explanation":"Negative verb + degree adverb"},{"arabicText":"مع هذا المقترح","englishText":"with this proposal","role":"object","explanation":"Prepositional object"}],"habitHint":"\"Actually\" means \"in reality / truth\". If you mean \"حالياً\", you must use \"currently\" or \"presently\".","specificMisconceptions":[{"pattern":"\\bsympathetic\\b","diagnosis":"“sympathetic” means feeling sorry for someone, not لطيف (nice)."}]},{"id":"ex-3-23-2","arabicThought":"أنا أعيش حالياً في مدريد (ليس في الواقع بل الآن)","englishTarget":"I am currently living in Madrid","acceptableAlternatives":["Currently I live in Madrid","I'm currently living in Madrid","I currently live in Madrid"],"wordChips":["I","am","currently","living","in","Madrid","actually","live","at","now"],"breakdownChunks":[{"arabicText":"أنا","englishText":"I","role":"subject","explanation":"Subject"},{"arabicText":"حالياً","englishText":"currently","role":"modifier","explanation":"Temporal adverb for \"at present\" (NEVER \"actually\"!)"},{"arabicText":"أعيش في مدريد","englishText":"am living in Madrid","role":"verb","explanation":"Continuous aspect for present situation"}],"habitHint":"For \"حالياً\" (nowadays / at the moment), use \"currently\", NEVER \"actually\".","specificMisconceptions":[{"pattern":"\\bsympathetic\\b","diagnosis":"“sympathetic” means feeling sorry for someone, not لطيف (nice)."},{"pattern":"\\bactually\\b","diagnosis":"“actually” means in fact (the false friend). It does not mean حالياً. For now / at this moment use currently or right now."}]},{"id":"ex-3-23-3","arabicThought":"أبدى الفريق تعاطفاً كبيراً مع موقفنا","englishTarget":"The team was very sympathetic to our situation","acceptableAlternatives":["The team was very sympathetic towards our situation","The team showed great sympathy for our situation"],"wordChips":["The","team","was","very","sympathetic","to","our","situation","friendly","kind","with"],"breakdownChunks":[{"arabicText":"الفريق","englishText":"The team","role":"subject","explanation":"Collective noun"},{"arabicText":"كان","englishText":"was","role":"verb","explanation":"Copula"},{"arabicText":"متعاطفاً جداً مع موقفنا","englishText":"very sympathetic to our situation","role":"modifier","explanation":"Showing compassion/understanding"}],"habitHint":"\"Sympathetic\" specifically means showing compassion (متعاطف), not merely friendly or pleasant.","specificMisconceptions":[{"pattern":"\\bactually\\b","diagnosis":"“actually” means in fact (the false friend). It does not mean حالياً. For now / at this moment use currently or right now."}]}]},{"id":"p3-l8","phaseId":3,"phaseTitle":"Mastery & Register","phaseLevel":"B2+ – C1","number":24,"title":"High-Register Collocations & Metaphorical Transfer","titleAr":"المتلازمات اللفظية الرفيعة (Collocations) والنقل المجازي","transferConcept":"Arabic speakers often translate figurative verbs literally (e.g. \"عملنا قرار\" = made a decision, \"لعب دوراً\" = played a role, \"اتخاذ تدابير\" = take measures). Mastering native C1 verb-noun collocations bridges the final gap to effortless native proficiency.","transferConceptAr":"كثير من المتلازمات في العربية تتطلب مقابلاً دقيقاً في الإنجليزية: اتخاذ تدابير (take measures / implement steps)، ولعب دوراً محورياً (play a pivotal role)، واتخاذ قرار (make a decision).","weakSpotTag":"advanced-collocations","exercises":[{"id":"ex-3-24-1","arabicThought":"يجب أن نتخذ إجراءات حاسمة لمعالجة هذه الأزمة","englishTarget":"We must take decisive measures to address this crisis","acceptableAlternatives":["We must take decisive action to address this crisis","We have to take decisive measures to handle this crisis"],"wordChips":["We","must","take","decisive","measures","to","address","this","crisis","make","do","solve"],"breakdownChunks":[{"arabicText":"يجب علينا","englishText":"We must","role":"auxiliary","explanation":"Obligation modal"},{"arabicText":"نتخذ إجراءات حاسمة","englishText":"take decisive measures","role":"verb","explanation":"Standard high-register collocation: TAKE measures (not \"make\" or \"do\")"},{"arabicText":"لمعالجة هذه الأزمة","englishText":"to address this crisis","role":"object","explanation":"Purpose infinitive with \"address\""}],"habitHint":"In English, you \"take measures\" or \"take action\", you never \"make measures\" or \"do measures\"."},{"id":"ex-3-24-2","arabicThought":"لعبت التكنولوجيا دوراً محورياً في هذا التحول","englishTarget":"Technology played a pivotal role in this transformation","acceptableAlternatives":["Technology has played a pivotal role in this transformation","Technology played a crucial role in this transformation"],"wordChips":["Technology","played","a","pivotal","role","in","this","transformation","made","did","the"],"breakdownChunks":[{"arabicText":"التكنولوجيا (عامة)","englishText":"Technology","role":"subject","explanation":"Zero-article generic concept"},{"arabicText":"لعبت دوراً محورياً","englishText":"played a pivotal role","role":"verb","explanation":"Collocation: play a pivotal role"},{"arabicText":"في هذا التحول","englishText":"in this transformation","role":"connector","explanation":"Domain prepositional phrase"}],"habitHint":"Pair \"play\" with \"a pivotal role\" (or \"a crucial role\") for natural C1 elegance."},{"id":"ex-3-24-3","arabicThought":"توصل الطرفان أخيراً إلى تسوية مقبولة للطرفين","englishTarget":"The two parties finally reached a mutually acceptable compromise","acceptableAlternatives":["Both parties finally reached a mutually acceptable compromise","The two parties finally reached a mutually acceptable agreement"],"wordChips":["The","two","parties","finally","reached","a","mutually","acceptable","compromise","arrived","made","to"],"breakdownChunks":[{"arabicText":"الطرفان","englishText":"The two parties","role":"subject","explanation":"Subject"},{"arabicText":"توصلا أخيراً","englishText":"finally reached","role":"verb","explanation":"Collocation: reach a compromise (NOT \"arrive to\")"},{"arabicText":"إلى تسوية مقبولة للطرفين","englishText":"a mutually acceptable compromise","role":"object","explanation":"Adverb + adjective + noun complement"}],"habitHint":"In English, you \"reach an agreement\" or \"reach a compromise\", not \"arrive to a compromise\"."}]}]}];
const PREBUILT_DECKS = [{"id":"daily-life-routines","name":"Daily Life & Routines","description":"40 essential everyday sentences covering morning habits, household chores, health, shopping, and time expressions where Arabic and English structures diverge.","author":"Thinking English Public Domain","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Universal Public Domain Dedication). Original sentences crafted for Thinking English to bridge Arabic-to-English structural habits across CEFR A1–B2.","cards":[{"ar":"أنا جائع جداً هذا الصباح","en":"I am very hungry this morning."},{"ar":"عادةً أستيقظ في الساعة السادسة والنصف","en":"I usually wake up at six thirty."},{"ar":"الطقس بارد جداً اليوم، أليس كذلك؟","en":"It is very cold today, isn’t it?"},{"ar":"عندي موعد مع طبيب الأسنان بعد الظهر","en":"I have a dentist appointment in the afternoon."},{"ar":"نسيت مفاتيحي داخل السيارة بالخطأ","en":"I accidentally left my keys inside the car."},{"ar":"هل تناولت وجبة الإفطار أم ليس بعد؟","en":"Have you had breakfast yet, or not yet?"},{"ar":"أبحث عن نظارتي منذ عشر دقائق","en":"I have been looking for my glasses for ten minutes."},{"ar":"أحتاج إلى شراء بعض الخضروات من السوق","en":"I need to buy some vegetables from the market."},{"ar":"القهوة ساخنة جداً ولا أستطيع شربها الآن","en":"The coffee is too hot for me to drink right now."},{"ar":"تستغرق الرحلة إلى وسط المدينة نصف ساعة","en":"It takes half an hour to get to the city center."},{"ar":"أنا متعب لأنني سهرت لوقت متأخر البارحة","en":"I am tired because I stayed up late last night."},{"ar":"هل يمكنك خفض صوت التلفاز قليلاً؟","en":"Could you turn down the TV a little?"},{"ar":"نفد الحليب من الثلاجة هذا الصباح","en":"We ran out of milk this morning."},{"ar":"أختي ماهرة جداً في طهي الطعام الإيطالي","en":"My sister is very good at cooking Italian food."},{"ar":"يذهب أطفالي إلى المدرسة بالحافلة كل يوم","en":"My children go to school by bus every day."},{"ar":"أشعر بصداع خفيف منذ الصباح","en":"I have had a slight headache since this morning."},{"ar":"من فضلك أطفئ الأنوار قبل أن تغادر الغرفة","en":"Please turn off the lights before you leave the room."},{"ar":"أفضل المشي في الحديقة بعد العشاء","en":"I prefer walking in the park after dinner."},{"ar":"كم مرة تذهب إلى النادي الرياضي في الأسبوع؟","en":"How often do you go to the gym a week?"},{"ar":"الغسالة لا تعمل بشكل صحيح اليوم","en":"The washing machine is not working properly today."},{"ar":"أنا خائف من التأخر عن الحافلة الأولى","en":"I am afraid of missing the first bus."},{"ar":"اعتدت على شرب الشاي الأخضر بدون سكر","en":"I am used to drinking green tea without sugar."},{"ar":"هناك ازدحام مروري شديد في الشارع الرئيسي","en":"There is heavy traffic on the main street."},{"ar":"سأقوم بترتيب غرفتي في عطلة نهاية الأسبوع","en":"I will tidy up my room on the weekend."},{"ar":"هذا القميص يناسبك تماماً","en":"This shirt fits you perfectly."},{"ar":"لا توجد أي رسائل جديدة في هاتفي","en":"There are no new messages on my phone."},{"ar":"يجب أن أنام مبكراً الليلة","en":"I have to go to bed early tonight."},{"ar":"شُحنت بطارية هاتفي بالكامل الآن","en":"My phone battery is fully charged now."},{"ar":"نحن نعيش في هذا الحي منذ ثلاث سنوات","en":"We have lived in this neighborhood for three years."},{"ar":"الجو يزداد برودة مع حلول المساء","en":"It is getting colder as evening approaches."},{"ar":"هل تمانع إذا فتحت النافذة لدخول الهواء؟","en":"Do you mind if I open the window for some fresh air?"},{"ar":"أحاول التقليل من تناول الحلويات مؤخراً","en":"I have been trying to cut down on sweets lately."},{"ar":"تأكد من إغلاق الباب بالمفتاح عند الخروج","en":"Make sure you lock the door when you go out."},{"ar":"والدي يستمع إلى الأخبار في الصباح دائماً","en":"My father always listens to the news in the morning."},{"ar":"لقد أمطرت بغزارة طوال الليل","en":"It rained heavily all night long."},{"ar":"ليس لدي وقت كافٍ لطهي الغداء اليوم","en":"I do not have enough time to cook lunch today."},{"ar":"سأمرّ على الصيدلية في طريقي إلى البيت","en":"I will stop by the pharmacy on my way home."},{"ar":"رائحة الخبز الطازج تملأ المطبخ","en":"The kitchen smells like fresh bread."},{"ar":"من المهم شرب كمية كافية من الماء يومياً","en":"It is important to drink enough water every day."},{"ar":"سأرتاح قليلاً على الأريكة قبل البدء","en":"I am going to rest on the sofa for a bit before starting."}]},{"id":"work-business","name":"Work & Business","description":"40 professional sentences for meetings, emails, deadlines, negotiations, and workplace communication with natural English collocations.","author":"Thinking English Public Domain","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Universal Public Domain Dedication). Original sentences crafted for Thinking English to bridge Arabic-to-English structural habits across CEFR A1–B2.","cards":[{"ar":"سأرسل لك التقرير المالي قبل نهاية اليوم","en":"I will send you the financial report by the end of the day."},{"ar":"تم تأجيل الاجتماع إلى يوم الثلاثاء القادم","en":"The meeting has been postponed until next Tuesday."},{"ar":"نحن بحاجة إلى مناقشة الميزانية بالتفصيل","en":"We need to discuss the budget in detail."},{"ar":"من المسؤول عن إدارة هذا المشروع؟","en":"Who is in charge of managing this project?"},{"ar":"أودّ أن أشكركم جميعاً على جهودكم الرائعة","en":"I would like to thank you all for your hard work."},{"ar":"يرجى إرفاق الملف المحدّث في رسالة البريد القادمة","en":"Please attach the updated file to your next email."},{"ar":"يعمل فريقنا على حل المشكلة التقنية حالياً","en":"Our team is currently working on fixing the technical issue."},{"ar":"هل لديك خمس دقائق للتحدث على انفراد؟","en":"Do you have five minutes to speak privately?"},{"ar":"الموعد النهائي لتسليم المقترح هو يوم الخميس","en":"The deadline for submitting the proposal is Thursday."},{"ar":"لقد وقّعنا العقد مع العميل الجديد صباح اليوم","en":"We signed the contract with the new client this morning."},{"ar":"أتطلع إلى التعاون معكم في المرحلة القادمة","en":"I look forward to collaborating with you in the next phase."},{"ar":"دعنا نراجع النقاط الرئيسية قبل اتخاذ القرار","en":"Let us go over the main points before making a decision."},{"ar":"لا أستطيع حضور الاجتماع لأنني مرتبط بموعد آخر","en":"I cannot attend the meeting because I have another commitment."},{"ar":"هل يمكنك مشاركة شاشتك معنا خلال المكالمة؟","en":"Could you share your screen with us during the call?"},{"ar":"ارتفعت مبيعات الشركة بنسبة عشرين بالمئة هذا العام","en":"Company sales increased by twenty percent this year."},{"ar":"أنا مهتم جداً بالتقديم على هذه الوظيفة","en":"I am very interested in applying for this position."},{"ar":"أقترح أن نبدأ بالنقطة الأكثر أهمية أولاً","en":"I suggest that we start with the most important point first."},{"ar":"لقد ارتكبنا خطأً صغيراً في الحسابات، لكننا صححناه","en":"We made a small mistake in the calculations, but we fixed it."},{"ar":"سأتصل بك بمجرد انتهاء اجتماعي الحالي","en":"I will call you back as soon as my current meeting ends."},{"ar":"تعتمد الخطة الجديدة على موافقة مجلس الإدارة","en":"The new plan depends on the board’s approval."},{"ar":"يعمل في هذه الشركة أكثر من مئتي موظف","en":"More than two hundred employees work at this company."},{"ar":"نحن نبحث عن حل طويل الأمد لهذه الأزمة","en":"We are looking for a long-term solution to this crisis."},{"ar":"هل تلقيت رسالتي الصوتية التي أرسلتها أمس؟","en":"Did you receive the voice message I sent yesterday?"},{"ar":"كان العرض التقديمي واضحاً ومقنعاً للغاية","en":"The presentation was very clear and convincing."},{"ar":"يجب أن نلتزم بالجدول الزمني المحدد للمشروع","en":"We must stick to the project schedule."},{"ar":"أعتذر عن التأخر في الرد على رسالتك","en":"I apologize for the delay in replying to your message."},{"ar":"تمت ترقية زميلي إلى منصب مدير القسم","en":"My colleague was promoted to department manager."},{"ar":"لا تتردد في التواصل معي إذا كان لديك أي استفسار","en":"Please feel free to reach out if you have any questions."},{"ar":"نحتاج إلى تقليل النفقات التشغيلية هذا الربع","en":"We need to reduce operating expenses this quarter."},{"ar":"الصوت يتقطع، هل يمكنك إعادة ما قلته؟","en":"Your voice is breaking up; could you repeat what you said?"},{"ar":"أنا أعمل عن بُعد من المنزل ثلاثة أيام في الأسبوع","en":"I work remotely from home three days a week."},{"ar":"ساعدتني هذه الدورة التدريبية على تطوير مهاراتي","en":"This training course helped me improve my skills."},{"ar":"علينا أخذ ملاحظات العملاء بعين الاعتبار","en":"We have to take customer feedback into account."},{"ar":"تم إلغاء المقابلة بسبب ظرف طارئ","en":"The interview was canceled due to an emergency."},{"ar":"أفضّل مناقشة هذا الموضوع وجهاً لوجه","en":"I prefer discussing this matter face to face."},{"ar":"سنعلن عن النتائج الرسمية في الأسبوع المقبل","en":"We will announce the official results next week."},{"ar":"هل وافق المدير على طلب إجازتك السنوية؟","en":"Did the manager approve your annual leave request?"},{"ar":"هذه الاستراتيجية وفّرت علينا الكثير من الوقت والجهد","en":"This strategy saved us a lot of time and effort."},{"ar":"سأرسل لك دعوة التقويم للاجتماع بعد قليل","en":"I will send you the calendar invite for the meeting shortly."},{"ar":"حقق المشروع نجاحاً فاق كل توقعاتنا","en":"The project achieved success beyond all our expectations."}]},{"id":"travel-social","name":"Travel & Social","description":"40 practical sentences for airports, hotels, restaurants, directions, making friends, and polite social interactions.","author":"Thinking English Public Domain","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Universal Public Domain Dedication). Original sentences crafted for Thinking English to bridge Arabic-to-English structural habits across CEFR A1–B2.","cards":[{"ar":"حجزت غرفة مزدوجة لمدة ثلاث ليالٍ في الفندق","en":"I booked a double room for three nights at the hotel."},{"ar":"في أي ساعة تقلع الطائرة المتجهة إلى لندن؟","en":"What time does the flight to London take off?"},{"ar":"عذراً، كيف يمكنني الوصول إلى أقرب محطة قطار؟","en":"Excuse me, how can I get to the nearest train station?"},{"ar":"هل يشمل سعر الغرفة وجبة الإفطار؟","en":"Does the room price include breakfast?"},{"ar":"أودّ الجلوس في مقعد بجوار النافذة من فضلك","en":"I would like a window seat, please."},{"ar":"تأخرت رحلتنا لمدة ساعتين بسبب سوء الأحوال الجوية","en":"Our flight was delayed for two hours due to bad weather."},{"ar":"هل يمكننا الحصول على قائمة الطعام والحساب من فضلك؟","en":"Could we have the menu and the bill, please?"},{"ar":"لقد استمتعنا كثيراً بوقتنا خلال العطلة الصيفية","en":"We really enjoyed ourselves during the summer vacation."},{"ar":"هذه أول مرة أزور فيها هذه المدينة التاريخية","en":"This is the first time I have visited this historic city."},{"ar":"هل تعرف مطعماً جيداً يقدّم مأكولات بحرية هنا؟","en":"Do you know a good restaurant that serves seafood around here?"},{"ar":"يقع المتحف على بُعد عشر دقائق سيراً على الأقدام","en":"The museum is a ten-minute walk from here."},{"ar":"سررت جداً بلقائك والتحدث معك اليوم","en":"It was really nice meeting and talking to you today."},{"ar":"هل تمانع في التقاط صورة لنا أمام هذا المعلم؟","en":"Would you mind taking a photo of us in front of this landmark?"},{"ar":"فقدت حقيبة سفري في المطار وأحتاج إلى المساعدة","en":"I lost my suitcase at the airport and need help."},{"ar":"أبحث عن هدية تذكارية مميزة لعائلتي","en":"I am looking for a special souvenir for my family."},{"ar":"دعنا نلتقي في المقهى القريب في تمام الساعة الخامسة","en":"Let us meet at the nearby cafe at five o’clock sharp."},{"ar":"الخدمة في هذا المطعم سريعة وممتازة للغاية","en":"The service at this restaurant is fast and excellent."},{"ar":"هل أحتاج إلى تأشيرة دخول لزيارة هذا البلد؟","en":"Do I need a visa to visit this country?"},{"ar":"شعرت بالغربة في البداية، لكنني تأقلمت سريعاً","en":"I felt homesick at first, but I adapted quickly."},{"ar":"أنصحك بزيارة السوق القديم في الصباح الباكر","en":"I recommend visiting the old market early in the morning."},{"ar":"وصلنا إلى المطار قبل موعد الرحلة بساعتين","en":"We arrived at the airport two hours before the flight."},{"ar":"هل يمكنني الدفع ببطاقة الائتمان أم نقداً فقط؟","en":"Can I pay by credit card, or is it cash only?"},{"ar":"صديقي متزوج من طبيبة تعمل في نفس المستشفى","en":"My friend is married to a doctor who works at the same hospital."},{"ar":"شكراً جزيلاً على كرم ضيافتكم وحسن استقبالكم","en":"Thank you very much for your warm hospitality."},{"ar":"المنظر من شرفة الغرفة يطلّ على البحر مباشرة","en":"The view from the balcony overlooks the sea directly."},{"ar":"علينا تسجيل المغادرة من الفندق قبل الساعة الثانية عشرة","en":"We have to check out of the hotel before twelve o’clock."},{"ar":"لماذا لا تنضم إلينا لتناول العشاء الليلة؟","en":"Why don’t you join us for dinner tonight?"},{"ar":"تأكد من حمل جواز سفرك وتذكرة الصعود معك","en":"Make sure you carry your passport and boarding pass with you."},{"ar":"كان الشاطئ مزدحماً جداً في عطلة نهاية الأسبوع","en":"The beach was very crowded over the weekend."},{"ar":"هل لديك أي خطط لعطلة العيد القادمة؟","en":"Do you have any plans for the upcoming holiday?"},{"ar":"أفضّل السفر بالقطار لأنه أكثر راحة من الحافلة","en":"I prefer traveling by train because it is more comfortable than the bus."},{"ar":"أقام أصدقائي حفلة صغيرة بمناسبة تخرّجي","en":"My friends threw a small party to celebrate my graduation."},{"ar":"سأرسل لك موقعي الحالي على الخريطة الآن","en":"I will send you my current location on the map right now."},{"ar":"المكان هادئ ومناسب جداً للقراءة والاسترخاء","en":"The place is quiet and very suitable for reading and relaxing."},{"ar":"لم أرَ صديق طفولتي منذ أكثر من خمس سنوات","en":"I have not seen my childhood friend for more than five years."},{"ar":"هل يمكنك التحدث ببطء أكثر من فضلك؟","en":"Could you speak a bit more slowly, please?"},{"ar":"استأجرنا سيارة صغيرة لاستكشاف القرى المجاورة","en":"We rented a small car to explore the neighboring villages."},{"ar":"الجميع هنا ودودون ويحبون مساعدة الزوار","en":"Everyone here is friendly and loves helping visitors."},{"ar":"أتمنى لك رحلة سعيدة وآمنة إلى وطنك","en":"I wish you a pleasant and safe trip home."},{"ar":"أخبرني بمجرد وصولك إلى البيت بسلام","en":"Let me know as soon as you get home safely."}]},{"id":"opinions-connectors","name":"Opinions & Connectors","description":"30 high-leverage B1–B2 sentences mastering contrast, cause-and-effect, conditionals, and expressing nuanced opinions without Arabic-style double connectors.","author":"Thinking English Public Domain","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Universal Public Domain Dedication). Original sentences crafted for Thinking English to bridge Arabic-to-English structural habits across CEFR A1–B2.","cards":[{"ar":"على الرغم من أن الاختبار كان صعباً، إلا أنني نجحت فيه","en":"Although the exam was difficult, I passed it."},{"ar":"في رأيي، الخبرة العملية أهم من الشهادات النظرية","en":"In my opinion, practical experience is more important than theoretical degrees."},{"ar":"أتفق معك إلى حدّ ما، ولكن هناك جانب آخر للموضوع","en":"I agree with you to some extent, but there is another side to the issue."},{"ar":"بغضّ النظر عن التكلفة، الجودة هي الأولوية دائماً","en":"Regardless of the cost, quality is always the priority."},{"ar":"لو كنت أعرف الحقيقة مبكراً، لتصرفت بطريقة مختلفة","en":"If I had known the truth earlier, I would have acted differently."},{"ar":"من ناحية الفكرة ممتازة، ومن ناحية أخرى تطبيقها مكلف","en":"On the one hand the idea is great, and on the other hand implementing it is costly."},{"ar":"بسبب هطول الأمطار الغزيرة، تم تأجيل المباراة النهائية","en":"Because of the heavy rain, the final match was postponed."},{"ar":"كلما قرأت أكثر، اتسعت مداركك وزادت حصيلتك اللغوية","en":"The more you read, the broader your perspective and vocabulary become."},{"ar":"لا شكّ أن التكنولوجيا غيّرت طريقة تواصلنا اليومية","en":"There is no doubt that technology has changed the way we communicate daily."},{"ar":"على عكس ما يعتقده الكثيرون، تعلّم اللغات يعتمد على الممارسة","en":"Contrary to what many people think, learning languages depends on practice."},{"ar":"ما لم نتحرك بسرعة، سنفقد هذه الفرصة الثمينة","en":"Unless we act quickly, we will lose this valuable opportunity."},{"ar":"بالإضافة إلى إتقانه العربية، فهو يتحدث الإنجليزية بطلاقة","en":"In addition to mastering Arabic, he speaks English fluently."},{"ar":"السبب الرئيسي لنجاح الفريق هو التعاون المستمر بينهم","en":"The main reason for the team’s success is their constant cooperation."},{"ar":"حتى لو واجهت بعض الصعوبات في البداية، لا تستسلم أبداً","en":"Even if you face some difficulties at first, never give up."},{"ar":"من وجهة نظري، الحوار الهادئ هو أفضل وسيلة لحل الخلافات","en":"From my point of view, calm dialogue is the best way to resolve disagreements."},{"ar":"لم يقتصر الأمر على توفير الوقت فحسب، بل حسّن الدقة أيضاً","en":"Not only did it save time, but it also improved accuracy."},{"ar":"بناءً على المعطيات الحالية، يبدو أن الخطة تسير في الاتجاه الصحيح","en":"Based on the current data, it seems the plan is moving in the right direction."},{"ar":"رغم تعبه الشديد، أصرّ على إنهاء العمل في وقته","en":"Despite being exhausted, he insisted on finishing the work on time."},{"ar":"لكي تحقق أهدافك، عليك أن تضع خطة واضحة وتلتزم بها","en":"In order to achieve your goals, you must set a clear plan and stick to it."},{"ar":"أعتقد أنه من الضروري الاستماع إلى جميع وجهات النظر أولاً","en":"I believe it is essential to listen to all points of view first."},{"ar":"بالمقارنة مع العام الماضي، تحسّن مستوى الأداء بشكل ملحوظ","en":"Compared to last year, performance has improved significantly."},{"ar":"في الواقع، لم أكن أتوقع أن تكون النتيجة بهذه السرعة","en":"In fact, I did not expect the result to come this quickly."},{"ar":"سواء وافقت أم لم توافق، القرار النهائي سيتخذ غداً","en":"Whether you agree or not, the final decision will be made tomorrow."},{"ar":"نتيجةً لذلك، قررت الإدارة فتح فرع جديد في المدينة","en":"As a result, management decided to open a new branch in the city."},{"ar":"بصراحة، أشعر أن هذا الاقتراح يحتاج إلى مزيد من الدراسة","en":"Honestly, I feel that this proposal needs further study."},{"ar":"طالما أنك تواصل المحاولة، فإنك تقترب من النجاح كل يوم","en":"As long as you keep trying, you get closer to success every day."},{"ar":"بدلاً من القلق بشأن الماضي، دعنا نركز على المستقبل","en":"Instead of worrying about the past, let us focus on the future."},{"ar":"مما لا يثير الدهشة أن الممارسة اليومية تصنع فارقاً كبيراً","en":"Unsurprisingly, daily practice makes a huge difference."},{"ar":"أميل إلى الاعتقاد بأن الحل البسيط هو الأفضل في معظم الأحيان","en":"I tend to believe that the simple solution is usually the best."},{"ar":"باختصار، النجاح الحقيقي يتطلب الصبر والاستمرارية","en":"In short, true success requires patience and consistency."}]},{"id":"beginner-starter-a0","name":"Ultra-Beginner 2-Word Starter (Zero Stress A0)","description":"15 bite-sized 2–4 word sentences designed for absolute beginners. Master \"am / is / are\" and \"have\" in seconds with zero stress!","author":"Thinking English Public Domain Commons","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Universal Public Domain Dedication). You can copy, modify, distribute, and study this deck freely without any copyright restrictions.","cards":[{"ar":"أنا جاهز الآن","en":"I am ready now."},{"ar":"أنا هنا اليوم","en":"I am here today."},{"ar":"هو مشغول جداً","en":"He is very busy."},{"ar":"هي سعيدة اليوم","en":"She is happy today."},{"ar":"نحن في البيت","en":"We are at home."},{"ar":"الجو جميل اليوم","en":"It is nice today."},{"ar":"عندي فكرة جيدة","en":"I have a good idea."},{"ar":"عندي سؤال بسيط","en":"I have a simple question."},{"ar":"هذا سهل جداً","en":"This is very easy."},{"ar":"القهوة جاهزة الآن","en":"The coffee is ready now."},{"ar":"أنا متأكد تماماً","en":"I am completely sure."},{"ar":"هم أصدقائي","en":"They are my friends."},{"ar":"المحل مفتوح الآن","en":"The shop is open now."},{"ar":"أريد كوب ماء","en":"I want a glass of water."},{"ar":"شكراً على مساعدتك","en":"Thank you for your help."}]},{"id":"lexicore-daily","name":"LexiCore Daily English","description":"High-frequency daily Arabic-to-English structural sentences focusing on natural collocations, time prepositions, and everyday spoken flow.","author":"Public Domain Language Commons","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Public Domain / Creative Commons Attribution 4.0 Compatible). Original pedagogical sentences dedicated to the public domain for unrestricted learning.","cards":[{"ar":"أنا في طريقي إلى الاجتماع الآن","en":"I am on my way to the meeting right now."},{"ar":"الأمر يعتمد على الظروف","en":"It depends on the circumstances."},{"ar":"لم أقصد مقاطعتك","en":"I did not mean to interrupt you."},{"ar":"هل يمكنك إرسال التفاصيل لي عبر البريد الإلكتروني؟","en":"Could you send me the details by email?"},{"ar":"استغرق المشروع وقتاً أطول مما توقعنا","en":"The project took longer than we expected."},{"ar":"أفضل العمل في الصباح الباكر","en":"I prefer working in the early morning."},{"ar":"هذا القرار منطقي تماماً","en":"This decision makes complete sense."},{"ar":"دعنا نبقى على تواصل هذا الأسبوع","en":"Let us stay in touch this week."},{"ar":"لدي خبرة خمس سنوات في هذا المجال","en":"I have five years of experience in this field."},{"ar":"من الضروري أن نصل في الموعد المحدد","en":"It is essential that we arrive on time."}]},{"id":"tatoeba-bridging","name":"Tatoeba Structural Bridges","description":"Community-curated Arabic–English sentence pairs targeting tense contrast, indirect questions, and idiomatic prepositions.","author":"Public Domain Sentence Commons","license":"CC0 1.0 Public Domain","disclaimer":"100% Copyright-Free (CC0 1.0 Public Domain / Creative Commons Attribution-ShareAlike 4.0 Compatible). Structural Arabic–English bridging sentences dedicated to the public domain.","cards":[{"ar":"منذ متى وأنت تنتظر هنا؟","en":"How long have you been waiting here?"},{"ar":"أتطلع إلى سماع رأيك قريباً","en":"I look forward to hearing your opinion soon."},{"ar":"لو كنت مكانك، لقبلت العرض فوراً" ive verb","tip":"Follows the subject “I” directly (“I like…”)."},"القهوة":{"en":"coffee","grammar":"Uncountable mass noun","tip":"Drop Arabic “الـ” when talking about coffee in general (“I like hot coffee”)."},"الساخنة":{"en":"hot","grammar":"Adjective (صفة)","tip":"Put the adjective BEFORE the noun without “the” (“hot coffee”)."},"بشكل":{"en":"in a way / generally","grammar":"Adverbial phrase helper","tip":"Signals that the noun is generic and takes Zero Article in English."},"عام":{"en":"general (in general)","grammar":"Adjective","tip":"In English, general concepts drop “the”."},"اشترى":{"en":"bought","grammar":"Past simple verb","tip":"Irregular past form of “buy” (“He bought”)."},"دراجة":{"en":"a bicycle / a bike","grammar":"Singular countable noun","tip":"Must have the indefinite article “a” (“a new bicycle”)."},"جديدة":{"en":"new","grammar":"Adjective (صفة)","tip":"Placed between “a” and the noun (“a new bicycle / a new language”)."},"الموسيقى":{"en":"Music","grammar":"Abstract uncountable noun","tip":"Generic concepts take Zero Article in English (“Music makes me happy”, not “The music”)."},"تجعلني":{"en":"makes me","grammar":"Causative verb + object suffix (ـني)","tip":"“Music” is singular uncountable, so the verb takes “-s” (“makes me”)."},"سعيدا":{"en":"happy","grammar":"Adjective complement","tip":"“Makes me + adjective” (“makes me happy”)."},"كفكرة":{"en":"as a concept","grammar":"Prepositional gloss","tip":"Reminds you that abstract concepts omit “the” in English."},"عامة":{"en":"general","grammar":"Adjective","tip":"General categories omit “the”."},"عندي":{"en":"I have","grammar":"Preposition + suffix (شبه جملة للملكية)","tip":"Literal: “at me”. English uses the active verb “I have” instead."},"محاضرة":{"en":"a lecture","grammar":"Singular countable noun","tip":"Requires “a” (“a chemistry lecture”)."},"كيمياء":{"en":"chemistry","grammar":"Noun adjunct (مضاف إليه)","tip":"Placed BEFORE “lecture” in English (“chemistry lecture”)."},"غدا":{"en":"tomorrow // Double-tap Arabic word lookup state
let popWord = null, popEntry = null, lastTapTime = 0, lastTapKey = "";
function lookupArWord(rawWord) {
  const clean = stripAr(rawWord);
  if (!clean) return null;
  if (LEXICON[clean]) return LEXICON[clean];
  const prefixes = ["و","ف","ب","ل","ك","ال","وال","بال","لل"];
  for (const pre of prefixes) {
    if (clean.startsWith(pre) && clean.length > pre.length + 1) {
      const stem = clean.slice(pre.length);
      if (LEXICON[stem]) return LEXICON[stem];
      if (LEXICON["ال" + stem]) return LEXICON["ال" + stem];
    }
  }
  return { en: rawWord, grammar: "Arabic Token", tip: "Compare how this word maps into the English sentence skeleton." };
}
function tapArWord(word, key) {
  const now = Date.now();
  if (lastTapKey === key && now - lastTapTime < 340) {
    lastTapTime = 0;
    lastTapKey = "";
    popWord = word;
    popEntry = lookupArWord(word);
    render();
  } else {
    lastTapTime = now;
    lastTapKey = key;
  }
}
function dblArWord(word) {
  popWord = word;
  popEntry = lookupArWord(word);
  render();
}

  }).join(" ")}</div>
  <div class="mt-1.5 text-[11px] opacity-70 flex flex-wrap items-center justify-between gap-1">
    <span>💡 Double-tap any Arabic word to translate it</span>

  </div>`;
  if (popWord && popEntry) {
    const cleanSpeak = String(popEntry.en || "").replace(/\(.*?\)/g, "").split("/")[0].trim();
    h += `<div class="mt-3 p-3.5 rounded-2xl bg-emerald-950/95 text-white border border-emerald-500/40 shadow-xl text-left">

let activeDeck = null, RQ = null, RS = false, RCUR = null, UNDO = null;

function cardSched(c, g) {
  c = c || { ease: 2.5, int: 0, reps: 0 };
  let e = c.ease, i = c.int, r = c.reps;
  if (g === 0) { e = Math.max(1.3, e - 0.2); i = 0; r = 0; }
  else if (g === 1) { e = Math.max(1.3, e - 0.15); i = Math.max(1, Math.round(i * 1.2)); }
  else if (g === 2) { i = r === 0 ? 1 : r === 1 ? 3 : Math.round(i * e); r++; }
  else { e += 0.15; i = r === 0 ? 3 : Math.round(Math.max(i, 1) * e * 1.3); r++; }
  return { ease: e, int: i, reps: r };
}

function cardData(k) {
  if (k.startsWith("c:")) {
    const c = (S.custom || []).find(x => "c:" + x.id === k);
    return c ? { ar: c.ar, en: c.en, m: null } : null;
  }
  const [li, ei] = k.split("-").map(Number);
  const e = L[li] && L[li].ex[ei];
  return e ? { ar: e.ar, en: e.a[0], m: e.m } : null;
}

function getDeckKeys(deckId) {
  S.custom = S.custom || [];
  S.importedDecks = S.importedDecks || [];
  const phaseKeys = pi => {
    const arr = [];
    L.forEach((l, li) => {
      if (l.pi === pi) l.ex.forEach((_, ei) => arr.push(li + "-" + ei));
    });
    return arr.sort((a, b) => (S.done[b] ? 1 : 0) - (S.done[a] ? 1 : 0));
  };
  if (deckId === "phase-1") return phaseKeys(0);
  if (deckId === "phase-2") return phaseKeys(1);
  if (deckId === "phase-3") return phaseKeys(2);
  if (deckId === "custom") return S.custom.filter(c => !c.deckId || c.deckId === "custom").map(c => "c:" + c.id);
  const pb = PREBUILT_DECKS.find(d => d.id === deckId);
  if (pb) {
    if (!S.importedDecks.includes(pb.id)) return [];
    return S.custom.filter(c => c.deckId === pb.id).map(c => "c:" + c.id);
  }
  return [...S.custom.map(c => "c:" + c.id), ...phaseKeys(0), ...phaseKeys(1), ...phaseKeys(2)];
}

function deckStats(deckId) {
  S.cards = S.cards || {};
  const keys = getDeckKeys(deckId);
  const now = Date.now();
  let n = 0, l = 0, d = 0;
  keys.forEach(k => {
    const c = S.cards[k];
    if (!c) n++;
    else if (c.reps === 0 || c.int < 1) l++;
    else if (c.due <= now) d++;
  });
  return { n, l, d, total: keys.length };
}

function cardQueue(deckId) {
  S.cards = S.cards || {};
  const now = Date.now();
  return getDeckKeys(deckId || activeDeck)
    .filter(k => {
      if (!cardData(k)) return false;
      const c = S.cards[k];
      if (!c) return true;
      if (c.reps === 0 || c.int < 1) return true;
      return c.due <= now;
    })
    .slice(0, 40);
}

    if (!existing.has(cid)) S.custom.push({ id: cid, ar: c.ar, en: c.en, deckId: pb.id });

function cardGrade(g) {
  const k = RQ.shift(), prev = S.cards[k] ? { ...S.cards[k] } : undefined;
  const today = new Date().toISOString().split("T")[0];
  S.reviewHistory = S.reviewHistory || {};
  UNDO = { k, prev, q: [k, ...RQ], score: S.score || 0, today, prevCnt: S.reviewHistory[today] || 0 };
  const s = cardSched(S.cards[k], g);
  S.cards[k] = { ...s, due: g ? Date.now() + s.int * 864e5 : Date.now() + 6e4 };
  if (g === 0) RQ.splice(Math.min(3, RQ.length), 0, k);
  else S.score = (S.score || 0) + 2;
  S.reviewHistory[today] = (S.reviewHistory[today] || 0) + 1;
  save();
  beep(g > 0);
  RS = false;
  popWord = null;
  if (!RQ.length) confetti();
  render();
}

function undoCard() {
  if (!UNDO) return;
  if (UNDO.prev === undefined) delete S.cards[UNDO.k];
  else S.cards[UNDO.k] = UNDO.prev;
  S.score = UNDO.score;
  if (UNDO.prevCnt <= 0) delete S.reviewHistory[UNDO.today];
  else S.reviewHistory[UNDO.today] = UNDO.prevCnt;
  RQ = UNDO.q;
  UNDO = null;
  RS = false;
  save();
  toast("Undid last card review ↩️");
  render();
}

// ---------------- TRANSLATE (auto-detect Arabic/English, translates as you type) ----------------
let TR = { src: "", out: "", from: "", to: "", busy: false }, trTimer = null;
const trIsAr = s => /[\u0600-\u06FF]/.test(s);

function translateV() {
  return `<div class="${CARD}"><div class="text-xs uppercase opacity-60 mb-2">Type or paste Arabic or English. Works 100% offline: each word is looked up in the built-in lexicon.</div>
    <textarea id="tri" rows="3" class="w-full rounded-xl border border-stone-300 dark:border-stone-700 bg-transparent p-3" style="font-size:16px" oninput="trType(this.value)" placeholder="اكتب هنا… / Type here…">${esc(TR.src)}</textarea>
    <p class="text-[11px] opacity-70 mt-2">🔒 <strong>Privacy note:</strong> Translations are sent to MyMemory.net. Don’t paste anything private.</p>
    <div class="flex gap-2 mt-2"><button class="${GH} flex-1" onclick="trPaste()">📋 Paste</button><button class="${GH} flex-1" onclick="trClear()">Clear</button></div></div>
    <div class="${CARD}" id="tro">${trOut()}</div>
    <p class="text-xs opacity-60">Offline word-by-word lookup, not a full translation. Words missing from the lexicon show a dash.</p>`;
}

function trOut() {
  if (!TR.rows || !TR.rows.length) return `<p class="text-sm opacity-60">Your word-by-word lookup appears here.</p>`;
  const ar = TR.from === "ar";
  const rows = TR.rows.map(r => `<div class="flex items-baseline justify-between gap-3 py-1 ${r.known ? "" : "opacity-50"}"><span ${ar ? 'dir="rtl" lang="ar" class="ar text-xl"' : 'class="font-semibold"'}>${esc(r.src)}</span><span translate="no" class="text-right ${r.known ? "font-semibold" : ""}" ${ar ? "" : 'dir="rtl" lang="ar"'}>${esc(r.out)}</span></div>${r.tip ? `<div class="text-xs opacity-60 mb-1">${esc(r.tip)}</div>` : ""}`).join("");
  return rows + `<div class="text-xs opacity-60 mt-2">${ar ? "Arabic \u2192 English" : "English \u2192 Arabic"} \u00b7 offline lexicon</div>` + (TR.out ? `<div class="flex flex-wrap gap-2 mt-3"><button class="${GH}" onclick="trHear()">\ud83d\udd0a Hear English</button><button class="${GH}" onclick="trCopy()">Copy</button><button class="${BTN}" onclick="trSave()">\u2795 Save as card</button></div>` : "");
}
function trShow() { const o = $("tro"); if (o) o.innerHTML = trOut(); }
function trType(v) { TR.src = v; clearTimeout(trTimer); trTimer = setTimeout(trRun, 600); }
function trClear() { TR = { src: "", out: "", from: "", to: "", busy: false }; render(); }
async function trPaste() {
  try { TR.src = await navigator.clipboard.readText(); const i = $("tri"); if (i) i.value = TR.src; trRun(); }
  catch (e) { toast("Paste blocked. Long-press the box and paste instead."); }
}
function enLookup(w) {
  if (!window._en) {
    window._en = {};
    Object.keys(LEXICON).forEach(ar => { const e = LEXICON[ar];
      String(e.en || "").toLowerCase().split(/\s*[\/,;]\s*|\s+or\s+/).forEach(v => { v = v.replace(/\(.*?\)/g, "").trim(); if (v && !window._en[v]) window._en[v] = { ar, grammar: e.grammar }; }); });
  }
  w = w.toLowerCase().replace(/[^a-z']/g, "");
  for (const x of [w, w.replace(/'s$/, ""), w.replace(/ies$/, "y"), w.replace(/(ing|ed|es|s)$/, "")]) if (x && window._en[x]) return window._en[x];
  return null;
}
// 100% offline word-by-word lookup using the built-in LEXICON (no network)
function trRun() {
  const q = TR.src.trim();
  if (!q) { TR.out = ""; TR.rows = []; trShow(); return; }
  TR.from = trIsAr(q) ? "ar" : "en"; TR.to = TR.from === "ar" ? "en" : "ar";
  const toks = q.split(/[\s\u060C,.!?\u061F;:()"\u201C\u201D]+/).filter(Boolean);
  TR.rows = toks.map(w => {
    if (TR.from === "ar") { const e = lookupArWord(w), k = !!e && e.grammar !== "Arabic Token"; return { src: w, out: k ? e.en : "\u2014", tip: k ? (e.grammar || "") : "not in lexicon", known: k }; }
    const h = enLookup(w); return { src: w, out: h ? h.ar : "\u2014", tip: h ? (h.grammar || "") : "not in lexicon", known: !!h };
  });
  TR.out = TR.rows.filter(r => r.known).map(r => r.out).join(" ");
  trShow();
}
function trHear() { speak(TR.to === "en" ? TR.out : TR.src, 1); }
function trCopy() { try { navigator.clipboard.writeText(TR.out).then(() => toast("Copied")); } catch (e) { toast("Couldn’t copy"); } }
function trSave() {
  if (!TR.out) return;
  const arS = TR.from === "ar" ? TR.src : TR.out, enS = TR.from === "ar" ? TR.out : TR.src;
  (S.custom = S.custom || []).push({ id: Date.now().toString(36), ar: arS.trim(), en: enS.trim(), deckId: "custom" });
  save(); RQ = null; toast("Saved to Cards ✓");
}

function hubV(){
  const pend=S.msgs.map((m,i)=>[m,i]).filter(([m])=>!m.r);
  let h=`<p class="text-xs opacity-70 mb-3">Messages are stored on this device only; cross-device sync needs a backend (e.g. Firebase).</p>
  <div class="${CARD}"><h3 class="font-semibold mb-2">Ask the Mentor</h3>
  <textarea id="q" rows="3" class="w-full rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-3" placeholder="Paste a tricky sentence or question…"></textarea>
  <div class="flex flex-wrap items-center gap-2 mt-2"><button class="${BTN}" onclick="send()">Send</button></div></div>`;
  if(S.bc.length)h+=`<div class="${CARD}"><h3 class="font-semibold mb-2">📢 Mini-lessons from your teacher</h3>${S.bc.map(b=>`<p class="text-sm mb-2">• ${esc(b)}</p>`).join("")}</div>`;
  if(S.msgs.length)h+=`<div class="${CARD}"><h3 class="font-semibold mb-2">Your questions</h3>${S.msgs.map(m=>`<div class="text-sm mb-3"><div>❓ ${esc(m.q)}</div><div class="mt-1 opacity-80">${m.r?"👩‍🏫 "+esc(m.r):"⏳ awaiting reply"}</div></div>`).join("")}</div>`;
  h+=`<div class="${CARD}"><h3 class="font-semibold mb-2">👩‍🏫 Teacher Demo Mode (UI Toggle)</h3>`;
  if(!T)h+=`<div class="flex gap-2"><input id="pin" type="password" placeholder="Demo PIN" class="rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-2 w-32"><button class="${BTN}" onclick="if($('pin').value==CONFIG.DEMO_PIN){T=true;render()}else toast('Wrong demo PIN')">Unlock Demo</button></div><p class="text-xs opacity-60 mt-2">Demo mode PIN: ${CONFIG.DEMO_PIN} (client-side UI toggle for local replies &amp; broadcasts)</p>`;
  else{
    h+=`<h4 class="text-sm font-semibold">Open questions (${pend.length})</h4>`+pend.map(([m,i])=>`<div class="my-2 text-sm"><div>${esc(m.q)}</div><textarea id="r${i}" rows="2" class="w-full rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-2 mt-1" placeholder="Reply…"></textarea><button class="${BTN} mt-1" onclick="reply(${i})">Reply</button></div>`).join("");
    h+=`<h4 class="text-sm font-semibold mt-4">Broadcast a mini-lesson</h4><textarea id="bt" rows="2" class="w-full rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-2"></textarea><button class="${BTN} mt-1" onclick="bcast()">Broadcast</button>
    <h4 class="text-sm font-semibold mt-4">Most-missed structures</h4>${weakV()}<button class="${GH} mt-3" onclick="T=false;render()">Lock Demo Mode</button>`;
  }
  return h+"</div>";
}
function send(){const q=$("q").value.trim();if(!q)return toast("Write a question first");S.msgs.push({q,r:""});save();render();toast("Sent to your mentor")}
function reply(i){const r=$("r"+i).value.trim();if(!r)return;S.msgs[i].r=r;save();render()}
function bcast(){const b=$("bt").value.trim();if(!b)return;S.bc.unshift(b);save();render();toast("Broadcast published")}
function weakV(){const w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]);
  return w.length?w.map(([k,v])=>`<div class="flex items-center gap-2 text-sm my-1"><span class="w-44 shrink-0 truncate">${esc(k)}</span><div class="h-2 rounded-full bg-rose-500" style="width:${Math.min(100,v*12)}px"></div><span>${v}</span></div>`).join(""):`<p class="text-sm opacity-70">No mistakes recorded yet.</p>`}

function heatmapV() {
  S.reviewHistory = S.reviewHistory || {};
  const cells = [];
  const today = new Date();
  for (let i = 139; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000).toISOString().split("T")[0];
    const cnt = S.reviewHistory[d] || 0;
    const cl = cnt <= 0 ? "bg-stone-200 dark:bg-stone-700/70" : cnt < 5 ? "bg-emerald-200 dark:bg-emerald-900" : cnt < 10 ? "bg-emerald-400 dark:bg-emerald-700" : cnt < 20 ? "bg-emerald-500" : "bg-emerald-700 dark:bg-emerald-300";
    cells.push(`<div title="${d}: ${cnt} reviews" class="w-3 h-3 rounded-[3px] ${cl}"></div>`);
  }
  return `<div class="${CARD}"><h3 class="font-semibold mb-1">Review Heatmap (Last 20 Weeks)</h3><div class="overflow-x-auto pb-1 mt-2"><div class="grid grid-rows-7 grid-flow-col gap-1 w-max">${cells.join("")}</div></div></div>`;
}

function progV(){
  const BG=[["🌱","First win",S.score>0],["🔥","5 in a row",S.best>=5],["⚡","10 in a row",S.best>=10],["🏛️","Phase 1 done",[0,1,2,3,4,5,6,7].every(comp)],["👑","All 24 lessons",L.every((_,i)=>comp(i))],["💬","Asked the mentor",S.msgs.length>0]];
  let h=`<div class="${CARD} grid grid-cols-3 text-center"><div><div class="text-2xl font-semibold">${S.score}</div><div class="text-xs opacity-70">score</div></div><div><div class="text-2xl font-semibold">${S.streak}</div><div class="text-xs opacity-70">streak</div></div><div><div class="text-2xl font-semibold">${S.best}</div><div class="text-xs opacity-70">best streak</div></div></div>`;
  h += voiceV();
  h += heatmapV();
  h += `<div class="${CARD}"><div class="flex justify-between text-sm mb-2"><span class="font-semibold">🏆 Level ${lvl()+1} · ${LV[lvl()]}</span><button class="text-xs underline" onclick="SND=!SND;render()">Sound ${SND?"on":"off"}</button></div><div class="h-2 rounded-full bg-stone-200 dark:bg-stone-700"><div class="h-2 rounded-full bg-teal-600" style="width:${lvl()>3?100:S.score%60/60*100}%"></div></div></div>
  <div class="${CARD}"><h3 class="font-semibold mb-2">Badges</h3><div class="grid grid-cols-3 gap-3 text-center">${BG.map(([e,n,ok])=>`<div class="${ok?"":"opacity-30 grayscale"}"><div class="text-3xl">${e}</div><div class="text-xs">${n}</div></div>`).join("")}</div></div>
  <div class="${CARD}">`;
  PHASES.forEach((p,pi)=>{let t=0,d=0;L.forEach((l,li)=>{if(l.pi==pi){t+=l.ex.length;d+=dn(li)}});const pc=Math.round(100*d/Math.max(1,t));
  h+=`<div class="mb-3"><div class="text-sm mb-1">Phase ${p.id} · ${esc(p.title)} · ${pc}%</div><div class="h-2 rounded-full bg-stone-200 dark:bg-stone-700"><div class="h-2 rounded-full bg-teal-600" style="width:${pc}%"></div></div></div>`});
  h+=`</div><div class="${CARD}"><h3 class="font-semibold mb-2">Weak spots</h3>${weakV()}</div>
  <div class="${CARD}"><h3 class="font-semibold mb-2">My notes</h3><textarea rows="4" class="w-full rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-3" oninput="S.notes=this.value;save()" placeholder="Habits to watch, new ideas…">${esc(S.notes)}</textarea></div>
  <div class="${CARD}"><h3 class="font-semibold mb-2">Feedback for your teacher</h3><div class="flex mb-3">${[1,2,3,4,5].map(n=>`<button onclick="FR=${n};render()" class="${n==FR?BTN:GH} flex-1 mx-0.5 !px-0">${['😕','🙁','😐','🙂','😍'][n-1]}</button>`).join("")}</div><textarea rows="3" class="w-full rounded-xl border border-stone-300 dark:border-stone-600 bg-transparent p-3" oninput="FT=this.value" placeholder="What helped? What was confusing?">${esc(FT)}</textarea><div class="flex gap-2 mt-2"><button class="${BTN} flex-1" onclick="window.open(fbLink(),'_blank')">WhatsApp</button><button class="${GH} flex-1" onclick="window.open('mailto:?subject='+encodeURIComponent('Thinking English™ feedback')+'&body='+encodeURIComponent(fbMsg()))">Email</button><button class="${GH} flex-1" onclick="copyFb()">Copy</button></div><button class="${GH} w-full mt-2" onclick="window.open(FORM,'_blank')">📝 Full feedback form (forms.gle)</button></div>
  <div class="${CARD}"><h3 class="font-semibold mb-1">Recap: the ${L.length} mental shifts</h3><p class="text-xs opacity-60 mb-2">Tap a shift to expand it.</p>${L.map((l,i)=>`<details class="border-t border-stone-200 dark:border-stone-700"><summary class="py-3 text-sm font-semibold">${l.num}. ${esc(l.t)}</summary><p class="text-sm opacity-85 pb-2">${esc(l.w)}</p><p dir="rtl" class="ar text-sm opacity-85 pb-3">${esc(l.wAr)}</p></details>`).join("")}</div>
  <button class="${GH}" onclick="if(confirm('Reset all progress?')){S=D();save();cur=null;RQ=null;render()}">Reset progress</button>`;
  return h;
}
function shareFriends(){
  const msg=`🧠 *Thinking English™: Arabic-to-English Transfer Journey*\nجرب تطبيق *Thinking English™* لتعلم التفكير بالإنجليزية من منطق اللغة العربية بدون حفظ قوائم أو قواعد معقدة 🚀\n\n✨ *Try the app here / جرب التطبيق من هنا:*\n${APP_URL}\n\n📝 *Share your review & feedback / شاركنا رأيك وتقييمك بعد التجربة:*\n${FORM}`;
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
function fbMsg(){const d=L.filter((_,i)=>comp(i)).length,w=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(", ")||"none";return `Thinking English™ feedback\nRating: ${FR?FR+"/5":"-"}\nLessons done: ${d}/${L.length} · Score: ${S.score}\nHardest: ${w}\n\n${FT}\n\nReview Form: ${FORM}`}
function fbLink(){return (TEACHER?"https://wa.me/"+TEACHER:"https://wa.me/")+"?text="+encodeURIComponent(fbMsg())}
function copyFb(){try{navigator.clipboard.writeText(fbMsg()).then(()=>toast("Copied. Paste it to your teacher"))}catch(e){toast("Couldn’t copy")}}
function beep(ok){
  if(SND){try{const a=new (window.AudioContext||window.webkitAudioContext)();(ok?[523,659,784]:[200,150]).forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.1;o.frequency.value=f;o.type=ok?"triangle":"sawtooth";o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate(ok?[20,40,20]:80)}catch(e){}
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const E=["🎉","⭐","✨","🔥","💚"];
  for(let i=0;i<26;i++){const s=document.createElement("span");s.className="conf";s.textContent=E[i%5];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}
}

applyTheme();
render();

/* ===== v4: Cards keyboard shortcuts + voice selector ===== */
document.addEventListener("keydown",e=>{
  if(tab!==4||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target&&e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(!RQ||!RQ.length)return;
  if(e.code==="Space"){e.preventDefault();if(!RS){RS=true;render()}}
  else if(RS&&["1","2","3","4"].includes(e.key)){e.preventDefault();cardGrade(+e.key-1)}
});
function voiceV(){
  loadV();
  const cur=(best()||{}).name;
  const sel=VO.length?`<select id="voice-sel" class="voice-sel" aria-label="English voice" onchange="S.voice=this.value;save();speak('Hello, this is how I sound.',1)">${VO.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`:`<p class="text-sm opacity-70">No English voices found yet. Tap any 🔊 button once, then reopen this tab.</p>`;
  return `<div class="${CARD}"><h3 class="font-semibold mb-2">🔊 Voice &amp; shortcuts</h3><label class="text-xs opacity-70" for="voice-sel">English voice</label>${sel}<p class="text-xs opacity-70 mt-3">Cards tab (keyboard): <kbd>Space</kbd> show answer · <kbd>1</kbd> Again · <kbd>2</kbd> Hard · <kbd>3</kbd> Good · <kbd>4</kbd> Easy</p></div>`;
}
